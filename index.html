<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge Automàtic i Calendari Mensual</title>
    <style>
        :root {
            --dark-blue: #070b19;
            --burgundy: #800020;
            --bronze-dark: #4a3318;
            --bronze-light: #d4af7a;
            --dial-bg: #0f1112;
            --luminous: #b3e0ff;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: var(--text-color);
        }

        /* Textura de vellut blau fosc */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.05) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            padding: 2rem;
            width: 100%;
            max-width: 1100px;
        }

        /* --- RELLOTGE --- */
        .watch-wrapper {
            width: 100%;
            max-width: 380px;
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.9));
        }

        .watch-svg {
            width: 100%;
            height: auto;
        }

        /* --- CALENDARI MENSUAL --- */
        .calendar-wrapper {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(205, 168, 122, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .calendar-header {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--bronze-light);
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-grid .day-name {
            font-weight: 700;
            color: var(--bronze-light);
            font-size: 0.9rem;
            padding-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .calendar-grid .day {
            padding: 0.6rem 0;
            border-radius: 8px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.2s ease;
        }

        .calendar-grid .day:hover:not(.empty) {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-grid .empty {
            color: transparent;
        }

        .calendar-grid .active {
            background-color: var(--burgundy);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.6);
            transform: scale(1.05);
        }

        /* --- RESPONSIVE --- */
        @media (min-width: 850px) {
            .container {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
                gap: 4rem;
                padding: 4rem;
            }
            
            .watch-wrapper {
                max-width: 420px;
            }

            .calendar-wrapper {
                max-width: 400px;
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- RELLOTGE SVG -->
        <div class="watch-wrapper">
            <svg class="watch-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradient bronze desgastat -->
                    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#5c3f22" />
                        <stop offset="25%" stop-color="#b88d5c" />
                        <stop offset="50%" stop-color="#4a3318" />
                        <stop offset="75%" stop-color="#d4af7a" />
                        <stop offset="100%" stop-color="#2a1a0a" />
                    </linearGradient>
                    
                    <!-- Gradient esfera -->
                    <radialGradient id="dialGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="70%" stop-color="#141618" />
                        <stop offset="100%" stop-color="#050505" />
                    </radialGradient>

                    <!-- Efecte de lluminositat -->
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <!-- Camí per al text del bezel -->
                    <path id="bezelPathLeft" d="M 80,200 A 120,120 0 0,1 120,90" fill="none" />
                </defs>

                <!-- Corretja de cautxú amb forats -->
                <g fill="#111" stroke="#222" stroke-width="2">
                    <path d="M 145 0 L 255 0 L 245 100 L 155 100 Z" />
                    <path d="M 155 300 L 245 300 L 255 400 L 145 400 Z" />
                    <!-- Forats -->
                    <rect x="170" y="20" width="60" height="12" rx="6" fill="#050505" stroke="none"/>
                    <rect x="170" y="45" width="60" height="12" rx="6" fill="#050505" stroke="none"/>
                    <rect x="170" y="70" width="60" height="12" rx="6" fill="#050505" stroke="none"/>
                    <rect x="170" y="330" width="60" height="12" rx="6" fill="#050505" stroke="none"/>
                    <rect x="170" y="355" width="60" height="12" rx="6" fill="#050505" stroke="none"/>
                </g>

                <!-- Caixa exterior (Bezel) de bronze -->
                <circle cx="200" cy="200" r="155" fill="url(#bronzeGradient)" stroke="#1a1005" stroke-width="4" />
                
                <!-- Anell interior del bezel -->
                <circle cx="200" cy="200" r="138" fill="#1a1a1a" />
                <circle cx="200" cy="200" r="138" fill="none" stroke="#2a1a0a" stroke-width="8" />

                <!-- Text del bezel (LIGHT, UP-MENU, DOWN) -->
                <text fill="#2a1a0a" font-family="Arial, sans-serif" font-weight="bold" font-size="10" letter-spacing="2">
                    <textPath href="#bezelPathLeft" startOffset="10%">LIGHT</textPath>
                    <textPath href="#bezelPathLeft" startOffset="40%">UP-MENU</textPath>
                    <textPath href="#bezelPathLeft" startOffset="75%">DOWN</textPath>
                </text>

                <!-- Cargols del bezel -->
                <g fill="#1a1005">
                    <!-- Cargol superior -->
                    <circle cx="200" cy="50" r="8" />
                    <line x1="194" y1="50" x2="206" y2="50" stroke="#6b4c2a" stroke-width="2" />
                    <!-- Cargol dret -->
                    <circle cx="350" cy="200" r="8" />
                    <line x1="350" y1="194" x2="350" y2="206" stroke="#6b4c2a" stroke-width="2" />
                    <!-- Cargol inferior -->
                    <circle cx="200" cy="350" r="8" />
                    <line x1="194" y1="350" x2="206" y2="350" stroke="#6b4c2a" stroke-width="2" />
                    <!-- Cargol esquerre -->
                    <circle cx="50" cy="200" r="8" />
                    <line x1="50" y1="194" x2="50" y2="206" stroke="#6b4c2a" stroke-width="2" />
                </g>

                <!-- Esfera (Dial) -->
                <circle cx="200" cy="200" r="118" fill="url(#dialGradient)" />

                <!-- Pista de minuts (Ticks) -->
                <circle cx="200" cy="200" r="108" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="2 6.85" />

                <!-- Marques de les hores (Batons) -->
                <!-- 12, 3, 6, 9 són més gruixudes o especials -->
                <g fill="#ffffff">
                    <!-- Triangle a les 12 -->
                    <polygon points="182,100 218,100 200,125" />
                    
                    <!-- Batons per a la resta d'hores -->
                    <!-- 1, 2, 4, 5, 7, 8, 10, 11 -->
                    <rect x="250" y="107" width="8" height="24" transform="rotate(30, 254, 119)" />
                    <rect x="285" y="145" width="8" height="24" transform="rotate(60, 289, 157)" />
                    
                    <rect x="285" y="231" width="8" height="24" transform="rotate(-60, 289, 243)" />
                    <rect x="250" y="269" width="8" height="24" transform="rotate(-30, 254, 281)" />
                    
                    <rect x="142" y="269" width="8" height="24" transform="rotate(30, 146, 281)" />
                    <rect x="107" y="231" width="8" height="24" transform="rotate(60, 111, 243)" />
                    
                    <rect x="107" y="145" width="8" height="24" transform="rotate(-60, 111, 157)" />
                    <rect x="142" y="107" width="8" height="24" transform="rotate(-30, 146, 119)" />
                </g>

                <!-- Números (1 a 12) estil militar -->
                <g fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" text-anchor="middle" dominant-baseline="central">
                    <text x="200" y="148">12</text>
                    <text x="255" y="158">1</text>
                    <text x="290" y="205">2</text>
                    <text x="278" y="268">3</text>
                    <text x="238" y="305">4</text>
                    <text x="200" y="315">5</text>
                    <text x="162" y="305">6</text>
                    <text x="122" y="268">7</text>
                    <text x="110" y="205">8</text>
                    <text x="145" y="158">9</text>
                    <text x="118" y="165">10</text>
                    <text x="150" y="130">11</text>
                </g>

                <!-- Text "VEN 18" -->
                <text x="245" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="middle">VEN 18</text>

                <!-- Agulles (Hands) -->
                <!-- Agulla de les hores (aprox a les 10) -->
                <g transform="rotate(-55, 200, 200)">
                    <!-- Forma d'espasa -->
                    <polygon points="188,200 212,200 206,120 194,120" fill="var(--luminous)" filter="url(#glow)"/>
                    <!-- Nucli fosc -->
                    <polygon points="195,195 205,195 202,130 198,130" fill="#1a1a1a" />
                </g>

                <!-- Agulla dels minuts (aprox a les 2) -->
                <g transform="rotate(65, 200, 200)">
                    <polygon points="190,200 210,200 205,95 195,95" fill="var(--luminous)" filter="url(#glow)"/>
                    <polygon points="196,195 204,195 202,105 198,105" fill="#1a1a1a" />
                </g>

                <!-- Agulla dels segons (aprox a les 7) -->
                <g transform="rotate(215, 200, 200)">
                    <line x1="200" y1="240" x2="200" y2="90" stroke="var(--luminous)" stroke-width="2" filter="url(#glow)"/>
                    <!-- Contrapès -->
                    <circle cx="200" cy="235" r="5" fill="var(--luminous)" />
                </g>

                <!-- Pivot central -->
                <circle cx="200" cy="200" r="7" fill="#1a1a1a" stroke="var(--luminous)" stroke-width="2" />
            </svg>
        </div>

        <!-- CALENDARI MENSUAL -->
        <div class="calendar-wrapper">
            <div class="calendar-header" id="monthYear"></div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Els dies s'injectaran amb JS -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const monthYearEl = document.getElementById('monthYear');
            const gridEl = document.getElementById('calendarGrid');
            
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); // 0-11
            const currentDate = today.getDate();

            // Noms dels mesos en català
            const monthNames = [
                "Gener", "Febrer", "Març", "Abril", "Maig", "Juny",
                "Juliol", "Agost", "Setembre", "Octubre", "Novembre", "Desembre"
            ];

            // Noms dels dies de la setmana (Començant per Dilluns)
            const dayNames = ["Dl", "Dt", "Dc", "Dj", "Dv", "Ds", "Dg"];

            // Mostrar capçalera
            monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Crear capçaleres dels dies
            dayNames.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.classList.add('day-name');
                dayHeader.textContent = day;
                gridEl.appendChild(dayHeader);
            });

            // Obtenir el primer dia del mes
            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            // Ajustar perquè Dilluns sigui 0 i Diumenge sigui 6 (estàndard europeu)
            let offset = firstDay === 0 ? 6 : firstDay - 1;

            // Obtenir el nombre de dies del mes
            let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Afegir cel·les buides per als dies abans del dia 1
            for (let i = 0; i < offset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day', 'empty');
                gridEl.appendChild(emptyCell);
            }

            // Afegir els dies del mes
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day');
                dayCell.textContent = day;

                // Marcar el dia actual en curs
                if (day === currentDate) {
                    dayCell.classList.add('active');
                }

                gridEl.appendChild(dayCell);
            }
        });
    </script>
</body>
</html>
