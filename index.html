<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadena de Bicicleta 3D - Cinemàtica Realista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030712;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 60%, #020617 100%);
    }
  </style>
</head>
<body>

  <canvas id="chainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('chainCanvas');
    const ctx = canvas.getContext('2d');

    const NUM_LINKS = 36;
    let LINK_LENGTH = 65; 
    let SPEED = 6;

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const minDim = Math.min(width, height);
      LINK_LENGTH = Math.max(30, Math.min(60, minDim * 0.055));
      SPEED = Math.max(4, LINK_LENGTH * 0.1); // velocitat original del primer index.html que em vas enviar
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Velocitat de l'extrem que en cada moment fa de motor (tractora).
    // L'altre extrem NO té velocitat pròpia: es deixa arrossegar per la
    // cadena (integració de Verlet), com faria un tram de corda o cadena real.
    let motorVX = SPEED * Math.SQRT1_2;
    let motorVY = SPEED * Math.SQRT1_2;

    // --- Intercanvi aleatori de tracció motriu ---
    // motorIsHead: quin extrem (0 = cap, N-1 = cua) porta la tracció en aquest moment.
    // NOMÉS un extrem és tractor a la vegada; l'altre és sempre arrossegat.
    // Periòdicament (a intervals aleatoris) la baula tractora canvia de banda i
    // la tracció s'inverteix de sentit.
    let motorIsHead = true;

    function swapTraction() {
      motorIsHead = !motorIsHead;
      // Inversió de tracció: el nou extrem motor arrenca en sentit contrari
      // al que portava l'anterior, conservant la velocitat.
      motorVX *= -1;
      motorVY *= -1;
    }

    function scheduleNextSwap() {
      const delay = 4000 + Math.random() * 7000; // entre 4 i 11 segons, aleatori
      setTimeout(() => {
        swapTraction();
        scheduleNextSwap();
      }, delay);
    }
    scheduleNextSwap();

    // Inicialització de les baules (nodes i perns). prevX/prevY guarden la
    // posició del fotograma anterior, necessària per a la integració de
    // Verlet dels trams no motoritzats (així conserven la seva pròpia inèrcia).
    const links = [];
    const startX = width / 2;
    const startY = height / 2;

    for (let i = 0; i < NUM_LINKS; i++) {
      const x = startX - i * LINK_LENGTH;
      const y = startY;
      links.push({ x, y, prevX: x, prevY: y, angle: 0 });
    }

    function resolveDistance(i, j, motorIdx) {
      const a = links[i], b = links[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const diff = (dist - LINK_LENGTH) / dist;
      const nx = dx * diff;
      const ny = dy * diff;

      if (i === motorIdx) {
        // La baula motora no es mou per aquesta restricció: està "pinçada".
        b.x -= nx;
        b.y -= ny;
      } else if (j === motorIdx) {
        a.x += nx;
        a.y += ny;
      } else {
        a.x += nx * 0.5;
        a.y += ny * 0.5;
        b.x -= nx * 0.5;
        b.y -= ny * 0.5;
      }
    }

    function constrainToWalls(link, margin) {
      if (link.x > width - margin) link.x = width - margin;
      else if (link.x < margin) link.x = margin;
      if (link.y > height - margin) link.y = height - margin;
      else if (link.y < margin) link.y = margin;
    }

    // Solucionador de Cinemàtica de Doble Articulació (Verlet + Rígid Limitador Àngular)
    function updatePhysics() {
      const margin = LINK_LENGTH;
      const motorIdx = motorIsHead ? 0 : NUM_LINKS - 1;

      // 1. Desplaçar únicament l'extrem tractor, amb rebot a les parets
      const motor = links[motorIdx];
      motor.prevX = motor.x;
      motor.prevY = motor.y;
      motor.x += motorVX;
      motor.y += motorVY;

      if (motor.x + margin >= width) { motor.x = width - margin; motorVX = -Math.abs(motorVX); }
      else if (motor.x - margin <= 0) { motor.x = margin; motorVX = Math.abs(motorVX); }
      if (motor.y + margin >= height) { motor.y = height - margin; motorVY = -Math.abs(motorVY); }
      else if (motor.y - margin <= 0) { motor.y = margin; motorVY = Math.abs(motorVY); }

      // 2. Integració de Verlet per a la resta de baules (incloent l'extrem
      //    passiu): cada una conserva el seu propi moviment d'inèrcia i és
      //    la cadena, no una velocitat pròpia, qui l'arrossega.
      const DAMPING = 0.985;
      for (let i = 0; i < NUM_LINKS; i++) {
        if (i === motorIdx) continue;
        const link = links[i];
        const vx = (link.x - link.prevX) * DAMPING;
        const vy = (link.y - link.prevY) * DAMPING;
        link.prevX = link.x;
        link.prevY = link.y;
        link.x += vx;
        link.y += vy;
      }

      // 3. Iteracions de restricció (distància, angle, parets i cos sòlid)
      const ITERATIONS = 12;
      const MAX_ANGLE_DIFF = Math.PI * 0.35; // Límit de flexió realista d'una cadena (aprox 63°)

      // Radi de "cos sòlid" de cada baula: si dues baules no adjacents s'acosten
      // més que això, es consideren en col·lisió i s'empenyen l'una a l'altra
      // en lloc de travessar-se.
      const COLLISION_RADIUS = LINK_LENGTH * 0.28;
      const MIN_DIST = COLLISION_RADIUS * 2;
      const SKIP_NEIGHBORS = 3; // no col·lisiona amb baules molt properes a la cadena (flexió natural)

      function resolveSelfCollisions() {
        for (let i = 0; i < NUM_LINKS; i++) {
          for (let j = i + SKIP_NEIGHBORS; j < NUM_LINKS; j++) {
            const dx = links[j].x - links[i].x;
            const dy = links[j].y - links[i].y;
            const dist = Math.hypot(dx, dy);

            if (dist > 0.0001 && dist < MIN_DIST) {
              const overlap = (MIN_DIST - dist) / 2;
              const nx = dx / dist;
              const ny = dy / dist;
              links[i].x -= nx * overlap;
              links[i].y -= ny * overlap;
              links[j].x += nx * overlap;
              links[j].y += ny * overlap;
            } else if (dist <= 0.0001) {
              // Coincidència exacta: separar-les una mica en direcció aleatòria
              const nx = Math.random() - 0.5;
              const ny = Math.random() - 0.5;
              links[i].x -= nx * 0.5;
              links[i].y -= ny * 0.5;
              links[j].x += nx * 0.5;
              links[j].y += ny * 0.5;
            }
          }
        }
      }

      for (let iter = 0; iter < ITERATIONS; iter++) {
        // Passada de distància: la baula motora queda pinçada; la resta
        // es relaxa simètricament (com una corda de Verlet).
        for (let i = 0; i < NUM_LINKS - 1; i++) resolveDistance(i, i + 1, motorIdx);
        for (let i = NUM_LINKS - 2; i >= 0; i--) resolveDistance(i, i + 1, motorIdx);

        // Aplicar restricció d'angles de doble articulació (evita col·lapsos o girs no naturals)
        for (let i = 1; i < NUM_LINKS - 1; i++) {
          let a1 = Math.atan2(links[i].y - links[i - 1].y, links[i].x - links[i - 1].x);
          let a2 = Math.atan2(links[i + 1].y - links[i].y, links[i + 1].x - links[i].x);
          
          let diff = a2 - a1;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          if (Math.abs(diff) > MAX_ANGLE_DIFF) {
            const clampedDiff = Math.sign(diff) * MAX_ANGLE_DIFF;
            const targetAngle = a1 + clampedDiff;
            links[i + 1].x = links[i].x + Math.cos(targetAngle) * LINK_LENGTH;
            links[i + 1].y = links[i].y + Math.sin(targetAngle) * LINK_LENGTH;
          }
        }

        // Contenir dins la pantalla totes les baules no motores (l'extrem
        // passiu i els trams intermedis també han de rebotar a les parets).
        for (let i = 0; i < NUM_LINKS; i++) {
          if (i === motorIdx) continue;
          constrainToWalls(links[i], margin);
        }

        // Cos sòlid: si la flexió ha fet que dues zones de la cadena es toquin,
        // empènyer-les en lloc de deixar-les travessar-se.
        resolveSelfCollisions();
      }

      // Calcular l'orientació exacte de cada baula (connectant pern anterior i posterior)
      for (let i = 0; i < NUM_LINKS - 1; i++) {
        const dx = links[i + 1].x - links[i].x;
        const dy = links[i + 1].y - links[i].y;
        links[i].angle = Math.atan2(dy, dx);
      }
      links[NUM_LINKS - 1].angle = links[NUM_LINKS - 2].angle;
    }

    function drawLinkShape(length, height) {
      const r = height / 2;
      const waist = height * 0.55;

      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI * 0.5, Math.PI * 1.5);
      ctx.quadraticCurveTo(length / 2, -waist / 2, length, -r);
      ctx.arc(length, 0, r, Math.PI * 1.5, Math.PI * 0.5);
      ctx.quadraticCurveTo(length / 2, waist / 2, 0, r);
      ctx.closePath();
    }

    function drawChain() {
      ctx.clearRect(0, 0, width, height);

      // Perspectiva 3D lateral de 20°
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(1.0, 0.9396); // cos(20°) ≈ 0.9396
      ctx.rotate(0.04);
      ctx.translate(-width / 2, -height / 2);

      // Quadrícula fons
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = -100; x < width + 100; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, -100); ctx.lineTo(x, height + 100); ctx.stroke();
      }
      for (let y = -100; y < height + 100; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(-100, y); ctx.lineTo(width + 100, y); ctx.stroke();
      }

      const plateW = LINK_LENGTH;
      const plateH = LINK_LENGTH * 0.55;

      // 1. OMBRES PROJECTADES 3D
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        ctx.save();
        ctx.translate(link.x + 10, link.y + 18);
        ctx.rotate(link.angle);
        ctx.fillStyle = 'rgba(2, 6, 23, 0.55)';
        drawLinkShape(plateW, plateH);
        ctx.fill();
        ctx.restore();
      }

      // 2. RODETS I PLAQUES INTERIORS
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        // Rodet central
        const rollerR = plateH * 0.38;
        const gradRoller = ctx.createRadialGradient(-rollerR*0.2, -rollerR*0.2, 1, 0, 0, rollerR);
        gradRoller.addColorStop(0, '#cbd5e1');
        gradRoller.addColorStop(0.5, '#475569');
        gradRoller.addColorStop(1, '#0f172a');
        ctx.fillStyle = gradRoller;
        ctx.beginPath(); ctx.arc(0, 0, rollerR, 0, Math.PI * 2); ctx.fill();

        // Placa Interior
        if (!isOuter) {
          const gradInner = ctx.createLinearGradient(0, -plateH/2, 0, plateH/2);
          gradInner.addColorStop(0, '#64748b');
          gradInner.addColorStop(0.5, '#334155');
          gradInner.addColorStop(1, '#0f172a');
          ctx.fillStyle = gradInner;
          ctx.strokeStyle = '#020617';
          ctx.lineWidth = 1.5;
          drawLinkShape(plateW, plateH);
          ctx.fill(); ctx.stroke();
        }

        ctx.restore();
      }

      // 3. PLAQUES EXTERIORS CROMADES I PERNS
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        if (isOuter) {
          const gradOuter = ctx.createLinearGradient(0, -plateH/2, 0, plateH/2);
          gradOuter.addColorStop(0, '#ffffff');
          gradOuter.addColorStop(0.2, '#e2e8f0');
          gradOuter.addColorStop(0.6, '#64748b');
          gradOuter.addColorStop(1, '#1e293b');
          ctx.fillStyle = gradOuter;
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2;
          drawLinkShape(plateW, plateH);
          ctx.fill(); ctx.stroke();
        }

        // Pern d'articulació (Cap de l'eix)
        const pinR = plateH * 0.22;
        const gradPin = ctx.createRadialGradient(-pinR*0.3, -pinR*0.3, 1, 0, 0, pinR);
        gradPin.addColorStop(0, '#ffffff');
        gradPin.addColorStop(0.5, '#94a3b8');
        gradPin.addColorStop(1, '#020617');
        ctx.fillStyle = gradPin;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, pinR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.arc(0, 0, pinR * 0.45, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }

      // 4 i 5. LEDS ALS EXTREMS: el color segueix la funció, no la posició.
      // La baula tractora (motor) sempre és verda; la subordinada, vermella.
      function drawLED(link, rgb) {
        ctx.save();
        ctx.translate(link.x, link.y);
        const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
        grad.addColorStop(0, `rgba(${rgb}, 1)`);
        grad.addColorStop(0.5, `rgba(${rgb}, 0.4)`);
        grad.addColorStop(1, `rgba(${rgb}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      const GREEN = '34, 197, 94';
      const RED = '239, 68, 68';

      drawLED(links[0], motorIsHead ? GREEN : RED);
      drawLED(links[NUM_LINKS - 1], motorIsHead ? RED : GREEN);

      ctx.restore(); // Fi transformació 3D
    }

    function loop() {
      updatePhysics();
      drawChain();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
