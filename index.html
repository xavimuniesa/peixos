<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquari Relaxant - Peixos Pallasso</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010a15;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Contenidor de l'aquari amb fons blavós suau i relaxant */
    .aquarium-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #0b4f6c 0%, #042743 65%, #011326 90%, #15100c 100%);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9);
    }

    /* Llum de la superfície suau i refractada */
    .sunrays {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: radial-gradient(ellipse at 50% -10%, rgba(120, 225, 255, 0.25) 0%, rgba(10, 60, 100, 0.05) 50%, transparent 80%);
      pointer-events: none;
    }

    /* Sòl marí */
    .seabed {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12%;
      background: linear-gradient(360deg, #2b1f17 0%, #4a382a 40%, transparent 100%);
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="aquarium-container">
  <div class="sunrays"></div>
  <div class="seabed"></div>
  <canvas id="aquariumCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('aquariumCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let globalTime = 0;

  // -------------------------------------------------------------
  // 1. CLASSE ALGUES I ANÈMONES (Moviment molt fluid i pausat)
  // -------------------------------------------------------------
  class Seaweed {
    constructor(x, baseWidth, height, segments, color, waveSpeed, waveAmp) {
      this.x = x;
      this.baseWidth = baseWidth;
      this.height = height;
      this.segments = segments;
      this.color = color;
      this.waveSpeed = waveSpeed;
      this.waveAmp = waveAmp;
      this.offset = Math.random() * 100;
    }

    draw(time) {
      ctx.save();
      ctx.beginPath();
      
      let startY = canvas.height;
      ctx.moveTo(this.x - this.baseWidth / 2, startY);

      for (let i = 0; i <= this.segments; i++) {
        let progress = i / this.segments;
        let currentY = startY - progress * this.height;
        let wave = Math.sin(time * this.waveSpeed + this.offset + progress * 2.5) * (this.waveAmp * progress);
        let width = (this.baseWidth / 2) * (1 - progress * 0.7);
        ctx.lineTo(this.x + wave - width, currentY);
      }

      for (let i = this.segments; i >= 0; i--) {
        let progress = i / this.segments;
        let currentY = startY - progress * this.height;
        let wave = Math.sin(time * this.waveSpeed + this.offset + progress * 2.5) * (this.waveAmp * progress);
        let width = (this.baseWidth / 2) * (1 - progress * 0.7);
        ctx.lineTo(this.x + wave + width, currentY);
      }

      ctx.closePath();
      
      let grad = ctx.createLinearGradient(this.x, canvas.height, this.x, canvas.height - this.height);
      grad.addColorStop(0, '#0a2e14');
      grad.addColorStop(0.5, this.color);
      grad.addColorStop(1, '#3a8c4c');
      
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  // -------------------------------------------------------------
  // 2. CLASSE BAMBOLLES (Fons i bufades pels peixos)
  // -------------------------------------------------------------
  class Bubble {
    constructor(x, y, isFromFish = false) {
      this.isFromFish = isFromFish;
      if (isFromFish) {
        this.x = x;
        this.y = y;
        this.radius = 0.8 + Math.random() * 2.5;
        this.speed = 0.3 + Math.random() * 0.5; // Molt lenta i relaxant
        this.swing = Math.random() * 0.03;
        this.swingAngle = Math.random() * Math.PI * 2;
        this.opacity = 0.5 + Math.random() * 0.4;
      } else {
        this.reset();
      }
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + 20;
      this.radius = 1 + Math.random() * 3.5;
      this.speed = 0.3 + Math.random() * 0.6; // Velocitat redueïda a la meitat per a pau
      this.swing = Math.random() * 0.03;
      this.swingAngle = Math.random() * Math.PI * 2;
      this.opacity = 0.15 + Math.random() * 0.3;
    }

    update() {
      this.y -= this.speed;
      this.swingAngle += this.swing;
      this.x += Math.sin(this.swingAngle) * 0.3;

      if (this.y < -10) {
        if (this.isFromFish) {
          return false; // Eliminar quan surti de la pantalla
        } else {
          this.reset();
        }
      }
      return true;
    }

    draw() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 245, 255, ${this.opacity})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity + 0.3})`;
      ctx.lineWidth = 0.6;
      ctx.stroke();
      ctx.restore();
    }
  }

  // Contenidor per a les bambolles extres bufades pels peixos
  let fishBubbles = [];

  // -------------------------------------------------------------
  // 3. CLASSE PEIX PALLASSO REALISTE I ARTICULAT (PAUSAT)
  // -------------------------------------------------------------
  class RealisticClownfish {
    constructor(x, y, scale) {
      this.x = x;
      this.y = y;
      this.scale = scale;

      // Velocitats molt suaus i pausades per generar tranquil·litat
      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.targetVx = this.vx;
      this.targetVy = this.vy;

      this.angle = 0;
      this.changeTimer = 0;
      this.facingRight = true;

      // Temporitzador per treure bombolles de la boca
      this.bubbleTimer = Math.random() * 300 + 200;

      // Segments de la cua per a un moviment harmònic i lent
      this.numSegments = 5;
      this.segmentAngles = new Array(this.numSegments).fill(0);
      this.tailPhase = Math.random() * Math.PI * 2;
    }

    update() {
      this.changeTimer++;
      // Canvi de trajectòria molt pausat i poc freqüent
      if (this.changeTimer > 250 + Math.random() * 200) {
        this.targetVx = (Math.random() - 0.5) * 0.8;
        this.targetVy = (Math.random() - 0.5) * 0.4;
        this.changeTimer = 0;
      }

      // Transició de velocitat extremadament suau (Lerp molt gradual)
      this.vx += (this.targetVx - this.vx) * 0.006;
      this.vy += (this.targetVy - this.vy) * 0.006;

      this.x += this.vx;
      this.y += this.vy;

      // Límits de la pantalla amb viratge suau
      const margin = 120;
      if (this.x < margin) this.targetVx = Math.abs(this.targetVx) + 0.2;
      if (this.x > canvas.width - margin) this.targetVx = -Math.abs(this.targetVx) - 0.2;
      if (this.y < margin + 60) this.targetVy = Math.abs(this.targetVy) + 0.15;
      if (this.y > canvas.height - margin) this.targetVy = -Math.abs(this.targetVy) - 0.15;

      // Orientació del cos
      if (Math.abs(this.vx) > 0.05) {
        this.facingRight = this.vx > 0;
      }

      // Animació d'ondulació harmoniosa i pausada
      let currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.tailPhase += currentSpeed * 0.08 + 0.012; // Moviment mot més calmat
      for (let i = 0; i < this.numSegments; i++) {
        this.segmentAngles[i] = Math.sin(this.tailPhase - i * 0.35) * (0.1 + i * 0.035);
      }

      // Llençar bombolles de la boca de tant en tant
      this.bubbleTimer--;
      if (this.bubbleTimer <= 0) {
        this.emitBubbles();
        this.bubbleTimer = 350 + Math.random() * 450; // Cada pocs segons
      }
    }

    emitBubbles() {
      // Calcular la posició exacta de la boca segons la direcció
      let mouthX = this.x + (this.facingRight ? 48 : -48) * this.scale;
      let mouthY = this.y + 2 * this.scale;

      // Llençar un petit grup de 2 a 4 bombolletes
      let count = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          fishBubbles.push(new Bubble(
            mouthX + (Math.random() * 6 - 3),
            mouthY + (Math.random() * 6 - 3),
            true
          ));
        }, i * 180); // Lleuger retard entre cada bombolla de la bufada
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);

      // Rotació molt suau segons inclinació
      let pitch = Math.atan2(this.vy, Math.abs(this.vx)) * 0.3;
      if (!this.facingRight) pitch = -pitch;
      ctx.rotate(pitch);

      if (!this.facingRight) {
        ctx.scale(-this.scale, this.scale);
      } else {
        ctx.scale(this.scale, this.scale);
      }

      // Ombra relaxant a l'aigua
      ctx.shadowColor = 'rgba(0, 10, 30, 0.3)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 12;

      // --- CUA ARTICULADA ---
      ctx.save();
      ctx.translate(-35, 0);
      ctx.rotate(this.segmentAngles[4]);
      
      ctx.fillStyle = '#ff6a00';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2.5;
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-20, -18, -32, -22);
      ctx.quadraticCurveTo(-26, 0, -32, 22);
      ctx.quadraticCurveTo(-20, 18, 0, 0);
      ctx.fill();
      ctx.stroke();

      // Vora negra posterior
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.moveTo(-28, -20);
      ctx.quadraticCurveTo(-32, -22, -33, -20);
      ctx.quadraticCurveTo(-27, 0, -33, 20);
      ctx.quadraticCurveTo(-32, 22, -28, 20);
      ctx.quadraticCurveTo(-23, 0, -28, -20);
      ctx.fill();

      ctx.restore();

      // --- ALETA DORSAL ---
      ctx.save();
      ctx.fillStyle = '#ff6a00';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-22, -18);
      ctx.quadraticCurveTo(-5, -34, 15, -20);
      ctx.quadraticCurveTo(-2, -10, -22, -18);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#111';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-22, -18);
      ctx.quadraticCurveTo(-5, -34, 15, -20);
      ctx.stroke();
      ctx.restore();

      // --- ALETA VENTRAL ---
      ctx.save();
      ctx.fillStyle = '#ff6a00';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-15, 16);
      ctx.quadraticCurveTo(0, 32, 18, 14);
      ctx.quadraticCurveTo(2, 10, -15, 16);
      ctx.fill();
      ctx.stroke();
      
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-15, 16);
      ctx.quadraticCurveTo(0, 32, 18, 14);
      ctx.stroke();
      ctx.restore();

      // --- COS PRINCIPAL ---
      let bodyGrad = ctx.createRadialGradient(10, -5, 5, 0, 0, 50);
      bodyGrad.addColorStop(0, '#ff851b');
      bodyGrad.addColorStop(0.6, '#ff5500');
      bodyGrad.addColorStop(1, '#d94100');

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 48, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- FRANGES BLANQUES REALISTES ---
      const drawStripe = (pathFn) => {
        ctx.save();
        ctx.fillStyle = '#111111';
        ctx.beginPath();
        pathFn(ctx, 3.5);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        pathFn(ctx, 0);
        ctx.fill();
        ctx.restore();
      };

      drawStripe((context, expand) => {
        context.ellipse(22, -1, 7 + expand, 22 + expand, -0.1, 0, Math.PI * 2);
      });

      drawStripe((context, expand) => {
        context.moveTo(-5 - expand, -23 - expand);
        context.quadraticCurveTo(8 + expand, 0, -3 - expand, 23 + expand);
        context.quadraticCurveTo(-14 - expand, 0, -5 - expand, -23 - expand);
      });

      drawStripe((context, expand) => {
        context.ellipse(-32, 0, 5 + expand, 16 + expand, 0, 0, Math.PI * 2);
      });

      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 48, 24, 0, 0, Math.PI * 2);
      ctx.stroke();

      // --- ULL I BOCA ---
      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.arc(32, -4, 5.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(33, -4, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(34.5, -5.5, 1.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#b83200';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(46, 2, 4, Math.PI * 0.8, Math.PI * 1.4);
      ctx.stroke();

      // --- ALETA PECTORAL (Batec ritmic i calmant) ---
      ctx.save();
      ctx.translate(12, 6);
      let finAngle = Math.sin(this.tailPhase * 1.2) * 0.25;
      ctx.rotate(0.3 + finAngle);
      
      let finGrad = ctx.createLinearGradient(0, 0, 15, 10);
      finGrad.addColorStop(0, 'rgba(255, 110, 0, 0.9)');
      finGrad.addColorStop(0.8, 'rgba(255, 140, 0, 0.8)');
      finGrad.addColorStop(1, 'rgba(0, 0, 0, 0.8)');

      ctx.fillStyle = finGrad;
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(8, 4, 12, 7, Math.PI / 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }
  }

  // -------------------------------------------------------------
  // INICIALITZACIÓ
  // -------------------------------------------------------------
  const seaweeds = [];
  const colors = ['#1e5927', '#277a35', '#194d22', '#2d8c3c', '#0f3d17'];

  // Generar algues del fons amb velocitat d'ondulació redueïda
  for (let i = 0; i < 26; i++) {
    let x = (canvas.width / 24) * i + (Math.random() * 40 - 20);
    let baseWidth = 18 + Math.random() * 16;
    let height = canvas.height * (0.35 + Math.random() * 0.45);
    let segments = 8 + Math.floor(Math.random() * 4);
    let color = colors[Math.floor(Math.random() * colors.length)];
    let waveSpeed = 0.5 + Math.random() * 0.5; // Molt més lenta
    let waveAmp = 15 + Math.random() * 20;

    seaweeds.push(new Seaweed(x, baseWidth, height, segments, color, waveSpeed, waveAmp));
  }

  // Bambolles d'ambient
  const bubbles = [];
  for (let i = 0; i < 25; i++) {
    bubbles.push(new Bubble());
  }

  // Peixos amb ritme pausat
  const clownfish1 = new RealisticClownfish(canvas.width * 0.3, canvas.height * 0.45, 1.15);
  const clownfish2 = new RealisticClownfish(canvas.width * 0.68, canvas.height * 0.55, 0.95);

  // -------------------------------------------------------------
  // BUCLE D'ANIMACIÓ RELAXANT
  // -------------------------------------------------------------
  function animate() {
    globalTime += 0.008; // Temps reduït per a un efecte visual més calmat
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Algues de fons
    seaweeds.forEach(seaweed => seaweed.draw(globalTime));

    // 2. Bambolles ambientals
    bubbles.forEach(bubble => {
      bubble.update();
      bubble.draw();
    });

    // 3. Bambolles creades pels peixos
    fishBubbles = fishBubbles.filter(b => {
      let alive = b.update();
      if (alive) b.draw();
      return alive;
    });

    // 4. Peixos pallasso
    clownfish1.update();
    clownfish1.draw();

    clownfish2.update();
    clownfish2.draw();

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
