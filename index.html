<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rellotge de Pèndol Clàssic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --wood-v: linear-gradient(90deg,#3d1408,#5a1f0c,#2b0d05);
  --wood-h: linear-gradient(#3d1408,#5a1f0c,#2b0d05);
  --brass: linear-gradient(135deg,#7a5412 0%,#e9c872 22%,#b8892c 45%,#f6e3a1 62%,#a0741f 82%,#6b4910 100%);
  --ty:0; --tx:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden; user-select:none; -webkit-user-select:none;
  background:#150c07; color:#e9d8b4;
  font-family:'IM Fell English',Georgia,serif;
  -webkit-tap-highlight-color:transparent;
}
/* ---------- PARET ---------- */
.wall{position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 50% at 30% 18%, rgba(255,186,105,.17), transparent 70%),
    radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.78) 100%),
    repeating-linear-gradient(90deg, rgba(255,230,190,.022) 0 1px, transparent 1px 34px, rgba(0,0,0,.06) 34px 36px),
    linear-gradient(#2b1a0f,#140b06);
}
.wainscot{position:fixed;left:0;right:0;bottom:0;height:9vh;
  background:linear-gradient(rgba(0,0,0,.0),rgba(0,0,0,.55)),linear-gradient(#24130a,#140a05);
  box-shadow:0 -2px 0 rgba(255,200,140,.06), 0 -3px 0 rgba(0,0,0,.6);}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2200px;}
.scaler{position:relative;width:400px;height:990px;flex:none;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.clock{position:relative;width:400px;height:990px;display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d;will-change:transform}
.wall-shadow{position:absolute;left:30px;top:40px;width:360px;height:930px;border-radius:120px 120px 16px 16px;
  background:rgba(0,0,0,.62);filter:blur(24px);transform:translateZ(-70px) translate(34px,34px);pointer-events:none}

/* ---------- CAIXES 3D ---------- */
.box{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;flex:none}
.f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{left:0;top:0;width:100%;height:100%;transform:translateZ(calc(var(--d) / 2))}
.side{top:var(--st,0px);height:var(--sh,100%);width:var(--d);background:var(--wood-v);background-size:256px 1024px}
.side.l{left:calc(var(--d) / -2);transform:rotateY(-90deg)}
.side.r{right:calc(var(--d) / -2);transform:rotateY(90deg)}
.side.l::after,.side.r::after{content:'';position:absolute;inset:0}
.side.l::after{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,190,130,.06) 60%,rgba(0,0,0,.2))}
.side.r::after{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.6))}
.topf{left:0;width:100%;height:var(--d);top:calc(var(--ty2) - var(--d) / 2);transform:rotateX(90deg);background:var(--wood-h);background-size:1024px 256px;backface-visibility:visible}
.topf::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(255,200,150,.10))}

/* ---------- CORONA ---------- */
.crown{--w:380px;--h:170px;--d:70px;--st:118px;--sh:52px;--ty2:118px;z-index:3}
.crown svg{display:block}

/* ---------- COS ---------- */
.body{--w:360px;--h:700px;--d:60px}
.body-front{transform-style:preserve-3d}
.bstrip{position:absolute;background:var(--wood-v);background-size:256px 1024px}
.bstrip.t{left:0;top:0;width:360px;height:20px;background:var(--wood-h);background-size:1024px 256px}
.bstrip.b{left:0;top:680px;width:360px;height:20px;background:var(--wood-h);background-size:1024px 256px;background-position:0 -120px}
.bstrip.l{left:0;top:20px;width:20px;height:660px}
.bstrip.r{left:340px;top:20px;width:20px;height:660px;background-position:-120px 0}
.bstrip::after{content:'';position:absolute;inset:0;pointer-events:none}
.bstrip.t::after{box-shadow:inset 0 2px 1px rgba(255,210,170,.18), inset 0 -3px 4px rgba(0,0,0,.7)}
.bstrip.b::after{box-shadow:inset 0 3px 4px rgba(0,0,0,.7), inset 0 -2px 2px rgba(0,0,0,.6)}
.bstrip.l::after{box-shadow:inset 2px 0 1px rgba(255,210,170,.16), inset -3px 0 4px rgba(0,0,0,.7)}
.bstrip.r::after{box-shadow:inset 3px 0 4px rgba(0,0,0,.7), inset -2px 0 2px rgba(0,0,0,.6)}

.cavity{position:absolute;left:20px;top:20px;width:320px;height:660px;transform-style:preserve-3d}
.cback{position:absolute;left:0;top:0;width:320px;height:660px;transform:translateZ(-26px)}
.cw{position:absolute;background:var(--wood-v);background-size:256px 1024px}
.cw::after{content:'';position:absolute;inset:0}
.cw.t{left:0;top:-13px;width:320px;height:26px;transform:translateZ(-13px) rotateX(-90deg);background:var(--wood-h)}
.cw.t::after{background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.55))}
.cw.b{left:0;top:647px;width:320px;height:26px;transform:translateZ(-13px) rotateX(90deg);background:var(--wood-h)}
.cw.b::after{background:linear-gradient(rgba(0,0,0,.6),rgba(255,190,130,.05))}
.cw.l{left:-13px;top:0;width:26px;height:660px;transform:translateZ(-13px) rotateY(90deg)}
.cw.l::after{background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.45))}
.cw.r{left:307px;top:0;width:26px;height:660px;transform:translateZ(-13px) rotateY(-90deg)}
.cw.r::after{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.8))}

/* ---------- ESFERA ---------- */
.dial{position:absolute;left:20px;top:20px;width:280px;height:280px;border-radius:50%;transform:translateZ(-10px);
  background:conic-gradient(from 12deg,#7d5a18,#f2dc98,#a47823,#fbe9b0,#86611c,#e9c979,#9b7022,#f7e3a3,#7d5a18);
  box-shadow:0 12px 20px rgba(0,0,0,.8),0 3px 5px rgba(0,0,0,.8)}
.dial::before{content:'';position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,244,205,.8),inset 0 0 0 4px rgba(120,85,20,.25),inset 0 0 0 5px rgba(255,240,200,.45),inset 0 -4px 6px rgba(0,0,0,.45),inset 0 3px 4px rgba(255,250,220,.45)}
.dface{position:absolute;left:12px;top:12px;width:256px;height:256px;border-radius:50%;overflow:hidden;background:#eadcb4;
  box-shadow:0 0 0 1px rgba(70,45,10,.8)}
.dface canvas{position:absolute;left:0;top:0}
.dshade{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 5px 10px rgba(50,28,5,.55),inset 0 0 3px rgba(50,28,5,.6)}
.dome{position:absolute;inset:0;border-radius:50%;pointer-events:none;overflow:hidden;
  background:radial-gradient(ellipse 70% 70% at 70% 85%, rgba(255,255,255,.07), rgba(255,255,255,0) 60%)}
.glare{position:absolute;left:-20%;top:-20%;width:140%;height:140%;will-change:transform;
  background:radial-gradient(ellipse 27% 17% at 37% 30%, rgba(255,255,255,.34), rgba(255,255,255,0) 100%)}

/* Finestres del calendari */
.win{position:absolute;height:22px;overflow:hidden;border-radius:1px;background:#efe2c0;transform:translateZ(0)}
.win::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(35,20,5,.55),rgba(35,20,5,0) 38%,rgba(35,20,5,0) 72%,rgba(35,20,5,.35));
  box-shadow:inset 0 3px 3px rgba(0,0,0,.6),inset 2px 0 2px rgba(0,0,0,.35),inset -2px 0 2px rgba(0,0,0,.35),inset 0 -1px 1px rgba(0,0,0,.3)}
.winlip{position:absolute;height:28px;border-radius:3px;pointer-events:none;
  box-shadow:0 1px 0 rgba(255,250,235,.95),0 -1px 0 rgba(90,60,20,.5),inset 0 0 0 1px rgba(160,120,50,.25)}
.win{cursor:pointer}
.drum{position:absolute;left:0;right:0;top:0;transition:transform 1.9s cubic-bezier(.45,.05,.3,1.12)}
.drum.instant{transition:none}
.drum div span{display:inline-block;transform-origin:50% 50%}
.drum div{height:22px;line-height:23px;text-align:center;white-space:nowrap;color:#140a02;
  font-family:'IM Fell English SC','IM Fell English',Georgia,serif;font-size:14.5px;letter-spacing:.4px;
  text-shadow:0 0 .8px rgba(20,10,0,.8);
  background:linear-gradient(#f3e7c8,#e6d4a6)}
.drum.num div{font-family:'IM Fell English',Georgia,serif;font-size:18px;letter-spacing:0}
.drum div.sat{background:linear-gradient(#072b1e,#135c43 30%,#2a8a66 46%,#146047 60%,#062519);color:#f4ead0;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.drum div.sun{background:linear-gradient(#3a0710,#761a29 30%,#a8394a 46%,#7a1d2c 60%,#33060d);color:#f4ead0;text-shadow:0 1px 1px rgba(0,0,0,.6)}

/* ---------- PORTA ---------- */
.door{position:absolute;left:20px;top:20px;width:320px;height:660px;transform-style:preserve-3d;transform-origin:0 50%;
  transform:translateZ(3px) rotateY(0deg);transition:transform 1.7s cubic-bezier(.45,.05,.25,1)}
.door.open{transform:translateZ(3px) rotateY(-100deg)}
.df{cursor:pointer}
.dial{cursor:zoom-in}
body.zoom .dial{cursor:zoom-out}
.df{position:absolute;background:var(--wood-v);background-size:256px 1024px}
.df::after{content:'';position:absolute;inset:0;pointer-events:none}
.df.t{left:0;top:0;width:320px;height:14px;background:var(--wood-h);background-size:1024px 256px;background-position:0 -40px}
.df.b{left:0;top:646px;width:320px;height:14px;background:var(--wood-h);background-size:1024px 256px;background-position:0 -180px}
.df.l{left:0;top:14px;width:14px;height:632px;background-position:-60px 0}
.df.r{left:306px;top:14px;width:14px;height:632px;background-position:-190px 0}
.df.t::after{box-shadow:inset 0 2px 1px rgba(255,215,175,.22),inset 0 -2px 2px rgba(0,0,0,.6)}
.df.b::after{box-shadow:inset 0 2px 2px rgba(0,0,0,.5),inset 0 -2px 2px rgba(0,0,0,.7)}
.df.l::after{box-shadow:inset 2px 0 1px rgba(255,215,175,.2),inset -2px 0 2px rgba(0,0,0,.6)}
.df.r::after{box-shadow:inset 2px 0 2px rgba(0,0,0,.5),inset -2px 0 2px rgba(0,0,0,.7)}
.glass{position:absolute;left:14px;top:14px;width:292px;height:632px;pointer-events:none;
  background:rgba(205,225,235,.035);
  box-shadow:inset 0 0 0 2px rgba(200,160,70,.6),inset 0 0 0 3px rgba(40,20,5,.6),inset 0 0 18px rgba(0,0,0,.35)}
.glass{overflow:hidden}
.refl{position:absolute;top:0;bottom:0;left:-80%;width:260%;will-change:transform;
  background:
    linear-gradient(112deg,transparent 14%,rgba(255,255,255,.13) 20%,rgba(255,255,255,.03) 27%,transparent 31%,transparent 55%,rgba(255,255,255,.07) 61%,transparent 67%),
    linear-gradient(to bottom,rgba(255,240,215,.07),transparent 28%,transparent 80%,rgba(255,240,215,.03));
}
.pend,.pshadow{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.pshadow{opacity:.62}
.wlayer{position:absolute;left:0;top:0;width:320px;height:660px;overflow:hidden;pointer-events:none;clip-path:inset(150px 0 0 0)}
.wlayer canvas{position:absolute;top:0;will-change:transform}
#wShadow{transform:translateZ(-25px);opacity:.6}
#wFront{transform:translateZ(-18px)}
.escutcheon::marker{display:none}
.keyhit{position:absolute;left:296px;top:296px;width:40px;height:64px;border:none;background:transparent;cursor:pointer;padding:0;transform:translateZ(2px)}
.escutcheon{position:absolute;left:307px;top:312px;width:12px;height:30px;pointer-events:none;border:none;cursor:pointer;padding:0;
  background:var(--brass);border-radius:6px 6px 3px 3px;transform:translateZ(1px);
  box-shadow:0 1px 2px rgba(0,0,0,.8),inset 0 0 0 1px rgba(80,55,10,.5)}
.escutcheon::before{content:'';position:absolute;left:4px;top:9px;width:4px;height:4px;border-radius:50%;background:#150c04}
.escutcheon::after{content:'';position:absolute;left:5px;top:12px;width:2px;height:7px;background:#150c04}
.key{position:absolute;left:1px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid #d9b25a;
  box-shadow:0 2px 2px rgba(0,0,0,.6);transform:translateZ(2px) translateX(9px);transition:transform .6s}
.escutcheon:hover{filter:brightness(1.15)}
.hinge{position:absolute;left:16px;width:7px;height:34px;border-radius:3px;transform:translateZ(4px);
  background:linear-gradient(90deg,#5c3f0c,#f3dc92 40%,#b08430 65%,#3d2906);box-shadow:1px 2px 2px rgba(0,0,0,.7)}
.hinge::before,.hinge::after{content:'';position:absolute;left:0;right:0;height:1px;background:rgba(40,25,5,.8)}
.hinge::before{top:11px}.hinge::after{top:22px}

/* ---------- BASE ---------- */
.base{--w:400px;--h:120px;--d:84px;--ty2:0px}
.base-front{background:var(--wood-h);background-size:1024px 256px;background-position:0 -90px}
.base-front::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;
  background:linear-gradient(rgba(255,215,175,.28) 0,rgba(255,215,175,.06) 3px,rgba(0,0,0,.45) 6px,rgba(0,0,0,0) 8px,rgba(0,0,0,0) 12px,rgba(0,0,0,.55) 16px)}
.base-front::after{content:'';position:absolute;left:0;right:0;bottom:0;height:18px;
  background:linear-gradient(rgba(255,210,170,.18),rgba(0,0,0,.2) 3px,rgba(0,0,0,.75));
  box-shadow:0 -1px 0 rgba(0,0,0,.6)}
.bead{position:absolute;left:0;right:0;top:9px;height:3px;background:var(--brass);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.kw{position:absolute;top:18px;width:64px;height:64px}
.kw.left{left:16px}.kw.right{right:16px}
.rosette{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,transparent 60%,#6d4d12 61%,#f5e2a2 67%,#c79d44 74%,#6d4d12 80%,transparent 82%);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.mark{position:absolute;width:5px;height:5px;border-radius:50%;background:#3a2606;box-shadow:0 .5px 0 rgba(255,240,200,.5)}
.knob{position:absolute;left:10px;top:10px;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;padding:0;
  background:repeating-conic-gradient(#5e410f 0 5deg,#e8c979 5deg 10deg);
  box-shadow:0 4px 6px rgba(0,0,0,.75),0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.35);outline:none}
.knob:focus-visible{box-shadow:0 0 0 3px rgba(255,215,120,.6),0 4px 6px rgba(0,0,0,.75)}
.cap{position:absolute;inset:4px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6cf,#e2bf62 30%,#a67b25 65%,#5a3d0c);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.55);
  transform:rotate(-55deg);transition:transform .55s cubic-bezier(.3,1.7,.5,1)}
.cap::after{content:'';position:absolute;left:50%;top:3px;width:4px;height:14px;margin-left:-2px;border-radius:2px;
  background:#3a2606;box-shadow:0 1px 0 rgba(255,240,200,.6)}
.knob.on .cap{transform:rotate(55deg)}
.knob.invite .cap{animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45) drop-shadow(0 0 4px rgba(255,220,130,.9))}}
.klabel{position:absolute;top:86px;width:96px;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:10px;letter-spacing:1.5px;
  color:#f0cf7a;text-shadow:0 1px 1px rgba(0,0,0,.9),0 0 1px rgba(0,0,0,.6)}
.klabel.left{left:0}.klabel.right{right:0}
.plaque{position:absolute;left:50%;top:17px;width:212px;height:84px;margin-left:-106px;border-radius:5px;background:var(--brass);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.75),inset 0 0 0 1px rgba(80,55,10,.7),inset 0 0 0 3px rgba(255,240,200,.28),inset 0 0 0 4px rgba(80,55,10,.4)}
.plaque::before,.plaque::after{content:'';position:absolute;top:38px;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(45deg,transparent 42%,rgba(40,25,5,.85) 43% 57%,transparent 58%),radial-gradient(circle at 35% 35%,#fff2c0,#b8892c 60%,#5a3d0c);
  box-shadow:0 1px 0 rgba(255,240,200,.5)}
.plaque::before{left:8px}.plaque::after{right:8px}
.engr{color:#3b2606;text-shadow:0 1px 0 rgba(255,246,212,.75),0 -1px 0 rgba(0,0,0,.35);white-space:nowrap;max-width:178px;overflow:hidden;text-overflow:ellipsis}
#plLoc{font-family:'IM Fell English SC','IM Fell English',serif;font-size:21px;letter-spacing:1.5px;line-height:1.1}
#plTemp{font-family:'IM Fell English',serif;font-size:25px;line-height:1.05;margin-top:1px}
#plInfo{font-family:'IM Fell English',serif;font-style:italic;font-size:13.5px;margin-top:1px}

#needle{transform-box:view-box;transform-origin:190px 110px;transform:rotate(-80deg);transition:transform 2.8s cubic-bezier(.3,1.35,.45,1)}

.hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-style:italic;font-size:13px;color:rgba(233,210,160,.55);
  transition:opacity 1.5s;pointer-events:none;padding:0 16px}
.hint.gone{opacity:0}
.viewer{position:fixed;display:none;border-radius:50% 50% 14px 14px / 27% 27% 14px 14px;
  background:var(--wood-v);background-size:256px 1024px;
  box-shadow:0 30px 60px rgba(0,0,0,.7),0 8px 18px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,210,170,.22),inset 0 -3px 6px rgba(0,0,0,.6),inset 3px 0 4px rgba(255,210,170,.08),inset -4px 0 6px rgba(0,0,0,.5)}
body.wide .viewer{display:block}
.viewer::before{content:'';position:absolute;left:50%;top:-14px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6cf,#e8c66a 35%,#a47a24 75%,#4f360b);box-shadow:0 3px 5px rgba(0,0,0,.7)}
.vinner{position:absolute;inset:24px;border-radius:50% 50% 8px 8px / 26% 26% 8px 8px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#3b2517 0%,#1d120a 55%,#0c0704 100%);
  box-shadow:inset 0 0 0 2px rgba(205,165,75,.75),inset 0 0 0 4px rgba(30,15,5,.85),inset 0 14px 34px rgba(0,0,0,.85)}
.vinner::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 16%,rgba(255,255,255,.07) 22%,rgba(255,255,255,.015) 29%,transparent 33%,transparent 62%,rgba(255,255,255,.04) 68%,transparent 74%)}
.vdial{position:absolute;left:50%}
.dial.big{left:0;top:0;transform-origin:0 0;cursor:default}
.vcap{position:absolute;left:50%;transform:translateX(-50%);padding:.45em 1.4em .5em;border-radius:5px;background:var(--brass);text-align:center;white-space:nowrap;
  box-shadow:0 3px 6px rgba(0,0,0,.75),inset 0 0 0 1px rgba(80,55,10,.7),inset 0 0 0 3px rgba(255,240,200,.28),inset 0 0 0 4px rgba(80,55,10,.4)}
#vDate{font-family:'IM Fell English',serif;font-style:italic;font-size:1.25em;line-height:1.2}
#vPlace{font-family:'IM Fell English SC','IM Fell English',serif;font-size:.95em;letter-spacing:.06em;margin-top:.15em}
.vcap .engr{max-width:none}
@media (max-width:640px){.hint{top:calc(8px + env(safe-area-inset-top));bottom:auto;font-size:12px}}
@media (prefers-reduced-motion: reduce){.door{transition:none}.knob.invite .cap{animation:none}}
</style>
</head>
<body>
<div class="wall"></div>
<div class="wainscot"></div>

<div class="stage">
 <div class="scaler" id="scaler">
  <div class="clock" id="clock">
   <div class="wall-shadow"></div>

   <!-- ===== CORONA ===== -->
   <div class="box crown">
    <div class="f side l"></div><div class="f side r"></div><div class="f topf"></div>
    <div class="f front">
     <svg viewBox="0 0 380 170" width="380" height="170" aria-label="Termòmetre">
      <defs>
       <pattern id="woodPat" patternUnits="userSpaceOnUse" width="1024" height="256"><image id="woodPatImg" width="1024" height="256" preserveAspectRatio="none" href=""/></pattern>
       <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7a5412"/><stop offset=".22" stop-color="#e9c872"/><stop offset=".45" stop-color="#b8892c"/>
        <stop offset=".62" stop-color="#f6e3a1"/><stop offset=".82" stop-color="#a0741f"/><stop offset="1" stop-color="#6b4910"/>

<script>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNoise(seed){
  const r=mulberry32(seed),p=new Uint8Array(512),perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]];}
  for(let i=0;i<512;i++)p[i]=perm[i&255];
  const g=new Float32Array(256);for(let i=0;i<256;i++)g[i]=r();
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),X=xi&255,Y=yi&255;
    const a=g[p[p[X]+Y]],b=g[p[p[X+1]+Y]],c=g[p[p[X]+Y+1]],d=g[p[p[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
}

/* ================= TEXTURA DE CAOBA PROCEDURAL ================= */
function makeWood(W,H,seed){
  const n1=makeNoise(seed),n2=makeNoise(seed+7),n3=makeNoise(seed+13);

  const ctx=c.getContext('2d'),img=ctx.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const warp=n1(x*.012,y*.0025)*2+n1(x*.03,y*.006)*.6;
    let grain=.5+.5*Math.sin((x*.045+warp*5)*Math.PI);
    grain=Math.pow(grain,2.2);

    let t=grain*.55+fiber*.3+fleck*.15;
    t+=(.5+.5*Math.sin(y*.045+n1(x*.02,y*.01)*6)-.5)*.14; // reflex "ribbon"

  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,0,0,.08)');g.addColorStop(.5,'rgba(255,190,140,.05)');g.addColorStop(1,'rgba(0,0,0,.08)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

}

const woodH=document.createElement('canvas');woodH.width=1024;woodH.height=256;
{const g=woodH.getContext('2d');g.translate(1024,0);g.rotate(Math.PI/2);g.drawImage(makeWood(256,1024,29),0,0);}
const urlV=woodV.toDataURL('image/jpeg',.85),urlH=woodH.toDataURL('image/jpeg',.85);

document.documentElement.style.setProperty('--wood-h',`url(${urlH})`);

// Dentells de la cornisa
{const g=$('dentils');let s='';for(let x=4;x<380;x+=12)s+=`<rect x="${x}" y="146" width="7" height="10" fill="rgba(0,0,0,.4)"/><rect x="${x}" y="145" width="7" height="10" fill="url(#woodPat)"/><rect x="${x}" y="145" width="7" height="1.2" fill="rgba(255,215,175,.3)"/>`;
 g.innerHTML=s+'<rect x="0" y="134" width="380" height="1" fill="rgba(255,215,175,.18)"/>';}

// Escala del termòmetre
{let t='',n='';for(let T=-10;T<=40;T++){const th=(-80+(T+10)*3.2)*Math.PI/180,maj=T%10===0,mid=T%5===0;
  const r0=maj?44.5:mid?47:49,r1=54,s=Math.sin(th),c=Math.cos(th);

  if(maj)n+=`<text x="${(190+34*s).toFixed(2)}" y="${(110-34*c).toFixed(2)}">${T}</text>`;}

function sizeCv(c,w,h,d){c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.width=w+'px';c.style.height=h+'px';}

/* ================= ESFERA ================= */
const ROMAN=['','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI','XII'];
function drawDialFace(g,dp){

  let gr=g.createRadialGradient(-30,-40,10,0,0,132);

  for(let i=0;i<14;i++){const a=r()*TAU,d=Math.sqrt(r())*110,x=Math.cos(a)*d,y=Math.sin(a)*d,s=8+r()*26;
    const sg=g.createRadialGradient(x,y,0,x,y,s);sg.addColorStop(0,`rgba(140,95,35,${.03+r()*.05})`);sg.addColorStop(1,'rgba(140,95,35,0)');g.fillStyle=sg;g.fillRect(x-s,y-s,s*2,s*2);}

  for(let i=0;i<22;i++){let x=(r()-.5)*220,y=(r()-.5)*220;g.beginPath();g.moveTo(x,y);for(let k=0;k<5;k++){x+=(r()-.5)*22;y+=(r()-.5)*22;g.lineTo(x,y);}g.stroke();}
  // Guilloché central
  g.strokeStyle='rgba(120,85,35,.10)';g.lineWidth=.5;for(let rr=6;rr<30;rr+=2.2){g.beginPath();g.arc(0,0,rr,0,TAU);g.stroke();}
  // Anell de minuts

const WD=['DIUMENGE','DILLUNS','DIMARTS','DIMECRES','DIJOUS','DIVENDRES','DISSABTE'];

/* Tambors del calendari: tira de paper circular (3 còpies) que llisca cap avall,
   com un cilindre intern; en acabar es recoloca a la còpia central sense que es noti */
function makeDrum(el,labels,cls){
  const n=labels.length;let h='';
  for(let r=0;r<3*n;r++){const i=(3*n-1-r)%n;h+=`<div class="${cls?cls(i):''}"><span>${labels[i]}</span></div>`;}
  el.innerHTML=h;
  const D={el,n,idx:-1,row:0,timer:0};
  return D;
}
function placeDrum(D,instant){
  D.el.classList.toggle('instant',instant);
  D.el.style.transform=`translateY(${-D.row*22}px)`;
  if(instant){void D.el.offsetWidth;D.el.classList.remove('instant');}
}
const wdCls=i=>i===6?'sat':i===0?'sun':'',DAYS=Array.from({length:31},(_,i)=>i+1);
const drums={
  wd:[makeDrum($('stripWd'),WD,wdCls),makeDrum($('stripWd2'),WD,wdCls)],
  day:[makeDrum($('stripDay'),DAYS),makeDrum($('stripDay2'),DAYS)],
  mon:[makeDrum($('stripMon'),MO),makeDrum($('stripMon2'),MO)]
};
const setDrums=(arr,idx,dir,instant)=>arr.map(D=>setDrum(D,idx,dir,instant)).some(Boolean);
function setDrum(D,idx,dir=1,instant=false){
  if(D.idx===idx)return false;
  const n=D.n,home=2*n-1-idx;
  clearTimeout(D.timer);
  if(D.idx<0||instant){D.idx=idx;D.row=home;placeDrum(D,true);return true;}
  const delta=dir>0?((idx-D.idx)%n+n)%n:((D.idx-idx)%n+n)%n;
  D.row+=dir>0?-delta:delta;D.idx=idx;placeDrum(D,false);
  D.timer=setTimeout(()=>{D.row=home;placeDrum(D,true);},2100);
  return true;
}
function showDate(d,dir,instant){

  moved=setDrums(drums.day,d.getDate()-1,dir,instant)||moved;
  moved=setDrums(drums.mon,d.getMonth(),dir,instant)||moved;

  const s=pshCv.getContext('2d');s.setTransform(1,0,0,1,0,0);s.clearRect(0,0,pshCv.width,pshCv.height);
  s.shadowColor='#000';s.shadowBlur=8*DPR;s.shadowOffsetX=5000;s.drawImage(pendCv,SH.pad*DPR-5000,SH.pad*DPR);
  pendCv.style.left=(PIV.x-SP.px)+'px';pendCv.style.top=(PIV.y-SP.py)+'px';pendCv.style.transformOrigin=`${SP.px}px ${SP.py}px`;
  pshCv.style.left=(PIV.x+SH.dx-SP.px-SH.pad)+'px';pshCv.style.top=(PIV.y+SH.dy-SP.py-SH.pad)+'px';pshCv.style.transformOrigin=`${SP.px+SH.pad}px ${SP.py+SH.pad}px`;
  startSwing();
}
let swings=[];
function startSwing(){
  swings.forEach(a=>a.cancel());
  swings=[[pendCv,-16],[pshCv,-25]].map(([el,z])=>el.animate(
    [{transform:`translateZ(${z}px) rotate(${-AMPD}deg)`},{transform:`translateZ(${z}px) rotate(${AMPD}deg)`}],
    {duration:1000,iterations:Infinity,direction:'alternate',easing:'cubic-bezier(.37,0,.63,1)'}));
  syncSwing(true);
  swings.forEach(a=>a.ready.then(()=>syncSwing(true)));
}
function syncSwing(force){
  const want=Date.now()%2000;
  swings.forEach(a=>{const cur=(a.currentTime||0)%2000;let d=Math.abs(cur-want);d=Math.min(d,2000-d);if(force||d>12)a.currentTime=want;});
}
setInterval(()=>syncSwing(false),20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSwing(true);});

/* ================= INCLINACIÓ 3D ================= */
const clockEl=$('clock'),reflEl=document.querySelector('.refl'),glareEl=$('glare');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tgX=3,tgY=7,lastMove=-1e9;
addEventListener('pointermove',e=>{
  const nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;let k=reduce?.3:1;
  if(zoomed)k*=.35;
  tgY=-nx*26*k;tgX=-ny*14*k;lastMove=performance.now();
},{passive:true});
function updateTilt(ts){
  if(ts-lastMove>5000&&!reduce){const k=zoomed?.35:1;tgY=7*k*Math.sin(ts/9000);tgX=k*(3+1.5*Math.sin(ts/13000));}
  tiltX+=(tgX-tiltX)*.05;tiltY+=(tgY-tiltY)*.05;
  clockEl.style.transform=`rotateX(${tiltX.toFixed(3)}deg) rotateY(${tiltY.toFixed(3)}deg)`;
  reflEl.style.transform=`translateX(${(tiltY*3.2).toFixed(2)}px)`;
  glareEl.style.transform=`translate(${(tiltY*1.6).toFixed(2)}px,${(-tiltX*2).toFixed(2)}px)`;
}

/* ================= ÀUDIO ================= */
let ac=null,master,wet,caseIn,noiseBuf,soundOn=false,chimesOn=store.get('chimes')!=='0',lastSched=0;
function impulse(sec,decay){const len=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
function initAudio(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=.9;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=3;
    master.connect(comp);comp.connect(ac.destination);
    const hall=ac.createConvolver();hall.buffer=impulse(2.4,3);wet=ac.createGain();wet.gain.value=.32;wet.connect(hall);hall.connect(master);
    const box=ac.createConvolver();box.buffer=impulse(.16,5);caseIn=ac.createGain();caseIn.gain.value=.55;caseIn.connect(box);box.connect(master);
    noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.05),ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume();
}
function env(g,t,peak,dur,att=.0008){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}
function click(t,freq,q,peak,dur,out){const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=q;
  const g=ac.createGain();env(g,t,peak,dur);n.connect(bp);bp.connect(g);g.connect(out);n.start(t);n.stop(t+.05);}
/* ---- Tic-tac per síntesi modal: modes metàl·lics (dent de l'escapament contra la paleta)
        + modes de la caixa de fusta ressonant + segon cop de bloqueig ---- */
let tickBufs=null;
function renderTick(tock,seed){
  const sr=ac.sampleRate,len=Math.floor(sr*.32),buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0),rnd=mulberry32(seed);
  const jit=()=>1+(rnd()-.5)*.03;
  const metal=tock?[[1180,.34,.022],[1790,.24,.014],[2640,.14,.009],[3900,.06,.006],[760,.2,.03]]
                  :[[1380,.32,.02],[2060,.22,.013],[3010,.13,.008],[4300,.05,.005],[880,.17,.026]];
  const wood=[[112,.46,.050],[198,.54,.040],[296,.42,.030],[430,.28,.022],[615,.15,.015],[870,.07,.010]];
  const woodGain=tock?1.3:1.05;
  function hit(t0,amp,metalK,woodK){
    const i0=Math.floor(t0*sr);
    for(const[f0,a,tau]of metal){const f=f0*jit(),ph=rnd()*6.283,w=6.2832*f/sr,k=Math.exp(-1/(tau*.4*sr*jit()));let e=a*amp*metalK*.6;
      for(let i=i0;i<len&&e>1e-5;i++){d[i]+=e*Math.sin(w*(i-i0)+ph);e*=k;}}
    for(const[f0,a,tau]of wood){const f=f0*jit(),w=6.2832*f/sr,k=Math.exp(-1/(tau*sr));let e=a*amp*woodK*woodGain;
      for(let i=i0;i<len&&e>1e-5;i++){const n=i-i0,att=n<sr*.0015?n/(sr*.0015):1;d[i]+=e*att*Math.sin(w*n);e*=k;}}
    // espetec del contacte (soroll molt curt i agut)
    let e=.14*amp,prev=0;const k=Math.exp(-1/(.0012*sr));
    for(let i=i0;i<len&&e>1e-5;i++){const x=rnd()*2-1;d[i]+=e*(x-prev);prev=x;e*=k;}
  }
  hit(0,1,1,1);                                   // la dent cau sobre la paleta
  hit(tock?.011:.009,.22,.6,.25);                 // rebot / bloqueig
  let pk=0;for(let i=0;i<len;i++)pk=Math.max(pk,Math.abs(d[i]));
  const g=(tock?.92:.78)/pk;for(let i=0;i<len;i++)d[i]*=g;
  return buf;
}
function makeTicks(){tickBufs={tic:[1,2,3].map(n=>renderTick(false,100+n)),toc:[1,2,3].map(n=>renderTick(true,200+n))};}
let tickOut=null;
function tick(t,tock,vol=1,rate=1){
  if(!tickBufs)makeTicks();
  if(!tickOut){tickOut=ac.createGain();tickOut.gain.value=.4;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.Q.value=.5;
    tickOut.connect(lp);lp.connect(master);}
  const arr=tock?tickBufs.toc:tickBufs.tic,src=ac.createBufferSource();
  src.buffer=arr[Math.floor(Math.random()*arr.length)];src.playbackRate.value=rate*(1+(Math.random()-.5)*.006);
  const g=ac.createGain();g.gain.value=vol*(.94+Math.random()*.08);src.connect(g);g.connect(tickOut);src.start(t);
}
/* Grinyol de frontissa: fricció stick-slip excitant ressonàncies de la porta */
function creak(t,dur,vol,pitch){
  const r=Math.random,n=48,rate=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1);rate[i]=(16+34*Math.pow(Math.sin(Math.PI*x),.7)+(r()-.5)*9)*pitch;}
  const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueCurveAtTime(rate,t,dur);
  const sum=ac.createGain();
  [[690,10,1],[1380,14,.55],[2070,16,.3],[410,7,.45]].forEach(([f,q,a])=>{
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;
    bp.frequency.setValueAtTime(f*pitch,t);bp.frequency.linearRampToValueAtTime(f*pitch*1.08,t+dur);
    const g=ac.createGain();g.gain.value=a;o.connect(bp);bp.connect(g);g.connect(sum);});
  const env=ac.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(vol,t+.09);
  env.gain.setValueAtTime(vol,t+dur*.55);env.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
  sum.connect(env);env.connect(lp);lp.connect(master);o.start(t);o.stop(t+dur+.05);
}
/* Avís mecànic abans de les campanes: el tren de sonada es desbloqueja i gira el ventilador */
function warning(t){
  tick(t,true,.5,.8);
  const n=16;for(let i=0;i<n;i++){const tt=t+.18+i*.034*(1+i*.02);tick(tt,i%2===0,.13*(1-i/n*.5),2.1);}
  const o=ac.createBufferSource();o.buffer=noiseBuf;o.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=2;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t+.15);g.gain.exponentialRampToValueAtTime(.05,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.85);
  o.connect(bp);bp.connect(g);g.connect(master);o.start(t+.15);o.stop(t+.9);
}
const PARTIALS=[[.5,.55,1],[1,1,.8],[1.183,.45,.55],[1.506,.35,.45],[2,.4,.35],[2.514,.22,.25],[2.662,.15,.22],[3.011,.12,.18],[4.166,.08,.12],[5.433,.05,.08]];
function bell(f,t,vol,decay){
  const out=ac.createGain();out.gain.value=vol;out.connect(master);out.connect(wet);
  PARTIALS.forEach(([r,a,dm])=>{const o=ac.createOscillator();o.frequency.value=f*r;const g=ac.createGain();env(g,t,a,decay*dm,.004);o.connect(g);g.connect(out);o.start(t);o.stop(t+decay*dm+.05);});
  click(t,f*6,2,.25,.03,out);
}
const NT={G:415.30,F:369.99,E:329.63,B:246.94};
const CHG={1:'GFEB',2:'EGFB',3:'EFGE',4:'GEFB',5:'BFGE'};
function westminster(q,hour,t){
  const seq={1:[1],2:[2,3],3:[4,5,1],4:[2,3,4,5]}[q];
  seq.forEach(c=>{[...CHG[c]].forEach((n,i)=>{bell(NT[n],t,.2,3.2);t+=i===3?1.45:.72;});});
  if(q===4){t+=.8;const n=hour%12||12;for(let i=0;i<n;i++){bell(164.81,t,.34,6);t+=2.1;}}
}
setInterval(()=>{
  if(!soundOn||!ac||document.hidden)return;
  const now=Date.now(),next=Math.ceil(now/1000)*1000,lead=next-now;
  scheduleWinding(now);
  if(next===lastSched||lead>150)return;
  lastSched=next;
  const t=Math.max(ac.currentTime,ac.currentTime+lead/1000-(ac.outputLatency||0));
  tick(t,(next/1000)%2===1);
  const d=new Date(next);
  if(chimesOn&&d.getSeconds()===0&&d.getMinutes()%15===0){const q=d.getMinutes()/15||4;warning(t+.25);westminster(q,d.getHours(),t+1.25);}
},20);

const soundKnob=$('soundKnob'),chimeKnob=$('chimeKnob'),hint=$('hint');
function setSound(on){
  soundOn=on;if(on)initAudio();lastSched=0;
  soundKnob.classList.toggle('on',on);soundKnob.classList.remove('invite');soundKnob.setAttribute('aria-pressed',on);
  hint.classList.add('gone');
}
function setChimes(on,preview){
  chimesOn=on;store.set('chimes',on?'1':'0');
  chimeKnob.classList.toggle('on',on);chimeKnob.setAttribute('aria-pressed',on);
  if(on&&preview&&soundOn&&ac)westminster(1,0,ac.currentTime+.4);
}
soundKnob.addEventListener('click',()=>setSound(!soundOn));
chimeKnob.addEventListener('click',()=>setChimes(!chimesOn,true));
setChimes(chimesOn,false);

/* ================= PORTA ================= */
const door=$('door');
function toggleDoor(){
  doorOpen=!doorOpen;door.classList.toggle('open',doorOpen);hint.classList.add('gone');applyView();
  if(soundOn&&ac){const t=ac.currentTime;
    if(doorOpen){tick(t,false,.22,.75);creak(t+.12,1.0,.045,1);}
    else{creak(t+.05,.85,.035,.92);tick(t+1.5,true,.42,.5);tick(t+1.56,false,.16,1.1);}}
}
$('keyBtn').addEventListener('click',toggleDoor);
door.querySelectorAll('.df').forEach(el=>el.addEventListener('click',toggleDoor));
function toggleZoom(){if(wide)return;zoomed=!zoomed;hint.classList.add('gone');applyView();}
document.querySelector('.dial').addEventListener('click',toggleZoom);
addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const k=e.key.toLowerCase();
  if(k==='s')setSound(!soundOn);else if(k==='c')setChimes(!chimesOn,true);else if(k==='p')toggleDoor();else if(k==='z')toggleZoom();
  else if(k==='escape'){if(zoomed)toggleZoom();else if(doorOpen)toggleDoor();}
});
setTimeout(()=>hint.classList.add('gone'),9000);

/* ================= TEMPERATURA I LLOC ================= */
const WMO={0:'Cel serè',1:'Gairebé serè',2:'Mig ennuvolat',3:'Cobert',45:'Boira',48:'Boira gebradora',51:'Plugim feble',53:'Plugim',55:'Plugim intens',56:'Plugim gelat',57:'Plugim gelat',
  61:'Pluja feble',63:'Pluja',65:'Pluja forta',66:'Pluja gelada',67:'Pluja gelada',71:'Neu feble',73:'Neu',75:'Neu forta',77:'Neu granulada',80:'Ruixats',81:'Ruixats',82:'Xàfecs',85:'Ruixats de neu',86:'Ruixats de neu',95:'Tempesta',96:'Tempesta i calamarsa',99:'Tempesta i calamarsa'};
let place=null;
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
async function locate(){
  try{
    const pos=await new Promise((res,rej)=>{if(!navigator.geolocation)return rej();navigator.geolocation.getCurrentPosition(res,rej,{timeout:9000,maximumAge:900000});});
    const lat=pos.coords.latitude,lon=pos.coords.longitude;let name='';
    try{const j=await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`);name=j.city||j.locality||j.principalSubdivision||'';}catch(e){}
    return{lat,lon,name};
  }catch(e){
    try{const j=await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=ca');
      if(j.latitude!=null)return{lat:j.latitude,lon:j.longitude,name:j.city||j.locality||j.principalSubdivision||''};}catch(e2){}
  }
  return{lat:41.4966,lon:2.1575,name:'Ripollet'};
}
function fitText(el,max){el.style.fontSize=max+'px';let s=max;while(el.scrollWidth>el.clientWidth+1&&s>9){s-=.5;el.style.fontSize=s+'px';}}
async function updateWeather(){
  try{
    if(!place){place=await locate();$('plLoc').textContent=place.name||'—';fitText($('plLoc'),21);}
    const j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto`);
    const T=j.current.temperature_2m,H=j.current.relative_humidity_2m,W=WMO[j.current.weather_code]||'';
    $('plTemp').textContent=`${T.toFixed(1).replace('.',',')} °C`;
    $('plInfo').textContent=`${W}${H!=null?' · '+Math.round(H)+' % humitat':''}`;
    $('vPlace').textContent=`${place.name||''} · ${T.toFixed(1).replace('.',',')} °C · ${W}`;
    fitText($('plInfo'),13.5);
    const deg=-80+(Math.max(-10,Math.min(40,T))+10)*3.2;
    $('needle').style.transform=`rotate(${deg}deg)`;
    $('plInfo').title=`Humitat relativa ${Math.round(H)} %`;
  }catch(e){$('plInfo').textContent='Sense dades del temps';fitText($('plInfo'),13.5);}
}
updateWeather();setInterval(updateWeather,15*60*1000);

/* ================= BUCLE PRINCIPAL ================= */
let hSec=-1,hSettled=false;
function frame(ts){
  const now=Date.now(),d=new Date(now),sec=d.getSeconds(),ms=d.getMilliseconds();
  updateTilt(ts);
  if(sec!==hSec){hSec=sec;hSettled=false;}
  if(ms<260)drawAllHands(d);else if(!hSettled){drawAllHands(d);hSettled=true;}
  updateWeights(now);updateCalendar(d);
  requestAnimationFrame(frame);
}
layout();
addEventListener('resize',layout);
Promise.all(['20px "IM Fell English"','600 9px "Cinzel"','16px "Pinyon Script"','italic 7px "IM Fell English"'].map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>paintDials());
fitWindows();
document.fonts.ready.then(()=>{fitWindows();paintDials();fitText($('plLoc'),21);fitText($('plInfo'),13.5);});
requestAnimationFrame(frame);
})();
