<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge i Calendari</title>
    <style>
        :root {
            --dark-blue: #0a1128;
            --burgundy: #800020;
            --bronze-dark: #6b4c2a;
            --bronze-light: #cda87a;
            --dial-bg: #1a1c1e;
            --luminous: #d4edff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Textura de vellut (Velvet texture) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.05) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        /* --- RELLOTGE --- */
        .watch-wrapper {
            width: 100%;
            max-width: 350px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        .watch-svg {
            width: 100%;
            height: auto;
        }

        /* --- CALENDARI --- */
        .calendar-wrapper {
            background: rgba(10, 17, 40, 0.6);
            border: 1px solid rgba(205, 168, 122, 0.2);
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .calendar {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            list-style: none;
        }

        .calendar li {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .calendar li:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .calendar li.active {
            background-color: var(--burgundy);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(128, 0, 32, 0.5);
            transform: scale(1.02);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- RESPONSIVE --- */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                justify-content: center;
                gap: 5rem;
                padding: 4rem;
            }
            
            .watch-wrapper {
                max-width: 450px;
            }

            .calendar-wrapper {
                max-width: 350px;
            }
        }

        /* Animacions de les agulles (opcional, per donar vida) */
        @keyframes tick {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- RELLOTGE SVG -->
        <div class="watch-wrapper">
            <svg class="watch-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradient per a la caixa de bronze -->
                    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8a6539" />
                        <stop offset="30%" stop-color="#d4af7a" />
                        <stop offset="50%" stop-color="#6b4c2a" />
                        <stop offset="70%" stop-color="#cda87a" />
                        <stop offset="100%" stop-color="#4a3318" />
                    </linearGradient>
                    
                    <!-- Gradient per a l'esfera -->
                    <radialGradient id="dialGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="80%" stop-color="#1a1c1e" />
                        <stop offset="100%" stop-color="#0a0a0a" />
                    </radialGradient>

                    <!-- Efecte de lluminositat per a les agulles -->
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Corretja (simplificada) -->
                <path d="M 140 0 L 260 0 L 250 100 L 150 100 Z" fill="#111" />
                <path d="M 150 300 L 250 300 L 260 400 L 140 400 Z" fill="#111" />
                <!-- Textura de la corretja -->
                <rect x="160" y="20" width="80" height="15" rx="5" fill="#222" />
                <rect x="160" y="45" width="80" height="15" rx="5" fill="#222" />
                <rect x="160" y="340" width="80" height="15" rx="5" fill="#222" />
                <rect x="160" y="365" width="80" height="15" rx="5" fill="#222" />

                <!-- Caixa exterior (Bezel) -->
                <circle cx="200" cy="200" r="150" fill="url(#bronzeGradient)" stroke="#2a1a0a" stroke-width="4" />
                
                <!-- Anell interior de la caixa -->
                <circle cx="200" cy="200" r="135" fill="#1a1a1a" />
                <circle cx="200" cy="200" r="135" fill="none" stroke="url(#bronzeGradient)" stroke-width="6" />

                <!-- Cargols del bezel -->
                <g fill="#2a1a0a">
                    <!-- Cargol superior -->
                    <circle cx="200" cy="60" r="6" />
                    <line x1="195" y1="60" x2="205" y2="60" stroke="#555" stroke-width="2" />
                    <!-- Cargol inferior dret -->
                    <circle cx="310" cy="270" r="6" />
                    <line x1="305" y1="265" x2="315" y2="275" stroke="#555" stroke-width="2" />
                    <!-- Cargol inferior esquerre -->
                    <circle cx="90" cy="270" r="6" />
                    <line x1="85" y1="265" x2="95" y2="275" stroke="#555" stroke-width="2" />
                    <!-- Cargol esquerre -->
                    <circle cx="65" cy="160" r="6" />
                    <line x1="60" y1="160" x2="70" y2="160" stroke="#555" stroke-width="2" />
                </g>

                <!-- Esfera (Dial) -->
                <circle cx="200" cy="200" r="115" fill="url(#dialGradient)" />

                <!-- Marques dels minuts (Ticks) -->
                <circle cx="200" cy="200" r="105" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="4 6.995" />
                
                <!-- Marques de les hores (gruixudes) -->
                <!-- 12, 3, 6, 9 -->
                <rect x="195" y="95" width="10" height="20" fill="#ffffff" />
                <rect x="285" y="195" width="20" height="10" fill="#ffffff" />
                <rect x="195" y="285" width="10" height="20" fill="#ffffff" />
                <rect x="95" y="195" width="20" height="10" fill="#ffffff" />

                <!-- Triangle a les 12 -->
                <polygon points="185,105 215,105 200,125" fill="#ffffff" />

                <!-- Números (1 a 12) -->
                <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="28" text-anchor="middle" dominant-baseline="central">
                    <text x="200" y="145">12</text>
                    <text x="252" y="155">1</text>
                    <text x="285" y="205">2</text>
                    <text x="275" y="265">3</text>
                    <text x="235" y="300">4</text>
                    <text x="200" y="315">5</text>
                    <text x="165" y="300">6</text>
                    <text x="125" y="265">7</text>
                    <text x="115" y="205">8</text>
                    <text x="148" y="155">9</text>
                    <text x="105" y="205" style="display:none;">10</text> <!-- Posicionament manual per 10 i 11 -->
                    <text x="115" y="175">10</text>
                    <text x="145" y="135">11</text>
                </g>

                <!-- Text "VEN 18" -->
                <text x="245" y="215" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">VEN 18</text>

                <!-- Agulles (Hands) -->
                <!-- Agulla de les hores (aprox a les 10) -->
                <g transform="rotate(-60, 200, 200)">
                    <polygon points="192,200 208,200 203,120 197,120" fill="var(--luminous)" filter="url(#glow)"/>
                </g>

                <!-- Agulla dels minuts (aprox a les 2) -->
                <g transform="rotate(60, 200, 200)">
                    <polygon points="194,200 206,200 202,100 198,100" fill="var(--luminous)" filter="url(#glow)"/>
                </g>

                <!-- Agulla dels segons (aprox a les 7) -->
                <g transform="rotate(210, 200, 200)">
                    <line x1="200" y1="230" x2="200" y2="100" stroke="var(--luminous)" stroke-width="2" filter="url(#glow)"/>
                    <circle cx="200" cy="200" r="4" fill="var(--luminous)" />
                </g>

                <!-- Pivot central -->
                <circle cx="200" cy="200" r="6" fill="#1a1a1a" stroke="var(--luminous)" stroke-width="2" />
            </svg>
        </div>

        <!-- CALENDARI -->
        <div class="calendar-wrapper">
            <ul class="calendar" id="calendar">
                <li data-day="1">Dilluns</li>
                <li data-day="2">Dimarts</li>
                <li data-day="3">Dimecres</li>
                <li data-day="4">Dijous</li>
                <li data-day="5">Divendres</li>
                <li data-day="6">Dissabte</li>
                <li data-day="0">Diumenge</li>
            </ul>
        </div>
    </div>

    <script>
        // Script per marcar el dia actual en curs
        document.addEventListener('DOMContentLoaded', () => {
            const daysElements = document.querySelectorAll('#calendar li');
            
            // Obtenir el dia actual (0 = Diumenge, 1 = Dilluns, etc.)
            const today = new Date().getDay();
            
            daysElements.forEach(el => {
                // Comparar el data-day amb el dia d'avui
                if (parseInt(el.getAttribute('data-day')) === today) {
                    el.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
