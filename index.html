<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquari Virtual - Peixos Pallasso</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #021027;
      font-family: sans-serif;
    }

    /* Fons d'aigua amb degradat i efecte de llum */
    .aquarium-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #104b7d 0%, #052244 70%, #021027 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8); /* Refracció del vidre */
    }

    /* Llum solar superior */
    .sunlight {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: radial-gradient(ellipse at 50% -20%, rgba(135, 220, 255, 0.4) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    /* Partícules / Espurnes de llum a l'aigua */
    .caustics {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
    }

    /* Canvas per als peixos */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="aquarium-container">
  <div class="sunlight"></div>
  <div class="caustics"></div>
  <canvas id="aquariumCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('aquariumCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Classe per a les boles d'aire (Bambolles)
  class Bubble {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + 10 + Math.random() * 20;
      this.radius = 1 + Math.random() * 4;
      this.speed = 0.5 + Math.random() * 1.5;
      this.swing = Math.random() * 0.05;
      this.swingAngle = Math.random() * Math.PI * 2;
      this.opacity = 0.3 + Math.random() * 0.5;
    }

    update() {
      this.y -= this.speed;
      this.swingAngle += this.swing;
      this.x += Math.sin(this.swingAngle) * 0.5;

      if (this.y < -10) {
        this.reset();
      }
    }

    draw() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity + 0.2})`;
      ctx.stroke();
      ctx.restore();
    }
  }

  // Classe Peix Pallasso
  class Clownfish {
    constructor(x, y, scale) {
      this.x = x;
      this.y = y;
      this.scale = scale;
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 1;
      this.targetVx = this.vx;
      this.targetVy = this.vy;
      this.tailAngle = 0;
      this.tailSpeed = 0.1;
      this.facingRight = this.vx > 0;
      this.changeTimer = 0;
    }

    update() {
      // Moviment aleatori fluid
      this.changeTimer++;
      if (this.changeTimer > 120 + Math.random() * 100) {
        this.targetVx = (Math.random() - 0.5) * 2.5;
        this.targetVy = (Math.random() - 0.5) * 1.5;
        this.changeTimer = 0;
      }

      // Suau transició de velocitat
      this.vx += (this.targetVx - this.vx) * 0.02;
      this.vy += (this.targetVy - this.vy) * 0.02;

      this.x += this.vx;
      this.y += this.vy;

      // Direcció de la mirada
      if (this.vx > 0.1) this.facingRight = true;
      if (this.vx < -0.1) this.facingRight = false;

      // Límits de la pantalla (rebota gradualment)
      const margin = 120;
      if (this.x < margin) this.targetVx = Math.abs(this.targetVx);
      if (this.x > canvas.width - margin) this.targetVx = -Math.abs(this.targetVx);
      if (this.y < margin) this.targetVy = Math.abs(this.targetVy);
      if (this.y > canvas.height - margin) this.targetVy = -Math.abs(this.targetVy);

      // Animació de la cua
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.tailAngle += this.tailSpeed * (speed + 0.5);
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);

      // Orientació segons el moviment
      if (!this.facingRight) {
        ctx.scale(-this.scale, this.scale);
      } else {
        ctx.scale(this.scale, this.scale);
      }

      // 1. Cua (Taronja amb vores negres i blanques)
      ctx.save();
      ctx.rotate(Math.sin(this.tailAngle) * 0.25);
      ctx.fillStyle = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(-40, 0);
      ctx.quadraticCurveTo(-65, -20, -70, -25);
      ctx.quadraticCurveTo(-60, 0, -70, 25);
      ctx.quadraticCurveTo(-65, 20, -40, 0);
      ctx.fill();
      // Vora negra de la cua
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // 2. Aletes dorsals i ventrals
      ctx.fillStyle = '#ff6600';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;

      // Aleta dorsal
      ctx.beginPath();
      ctx.moveTo(-20, -18);
      ctx.quadraticCurveTo(0, -35, 20, -15);
      ctx.quadraticCurveTo(0, -10, -20, -18);
      ctx.fill();
      ctx.stroke();

      // Aleta ventral
      ctx.beginPath();
      ctx.moveTo(-10, 15);
      ctx.quadraticCurveTo(5, 30, 15, 12);
      ctx.fill();
      ctx.stroke();

      // 3. Cos (Taronja intens)
      ctx.fillStyle = '#ff6000';
      ctx.beginPath();
      ctx.ellipse(0, 0, 45, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      // 4. Franges blanques caràcterístiques amb vora negra
      const drawStripe = (x, width) => {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x, 0, width, 21, 0, Math.PI * 0.4, Math.PI * 1.6);
        ctx.fill();
        ctx.stroke();
      };

      // Franja 1 (Cap)
      drawStripe(20, 6);
      // Franja 2 (Mig)
      drawStripe(-5, 7);
      // Franja 3 (Cua)
      drawStripe(-30, 5);

      // Re-dibuixar el contorn exterior per netejar les franges
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, 45, 22, 0, 0, Math.PI * 2);
      ctx.stroke();

      // 5. Ull
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(28, -5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(29, -5, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 6. Aleta pectoral (suau moviment)
      ctx.save();
      ctx.translate(10, 5);
      ctx.rotate(Math.sin(this.tailAngle * 1.5) * 0.2);
      ctx.fillStyle = 'rgba(255, 102, 0, 0.8)';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 6, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }
  }

  // Inicialització d'elements
  const fish1 = new Clownfish(canvas.width * 0.3, canvas.height * 0.4, 0.9);
  const fish2 = new Clownfish(canvas.width * 0.7, canvas.height * 0.6, 1.2);

  const bubbles = [];
  for (let i = 0; i < 25; i++) {
    bubbles.push(new Bubble());
  }

  // Bucle d'animació
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Actualitzar i dibuixar bambolles
    bubbles.forEach(b => {
      b.update();
      b.draw();
    });

    // Actualitzar i dibuixar peixos
    fish1.update();
    fish1.draw();

    fish2.update();
    fish2.draw();

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
