<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge Automàtic i Calendari Mensual</title>
    <style>
        :root {
            --dark-blue: #070b19;
            --burgundy: #800020;
            --bronze-light: #d4af7a;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: var(--text-color);
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.05) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 1100px;
        }

        /* --- RELLOTGE RESPONSIVE --- */
        .watch-wrapper {
            width: 100%;
            max-width: 420px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.85));
        }

        .watch-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CALENDARI MENSUAL --- */
        .calendar-wrapper {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(212, 175, 122, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .calendar-header {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--bronze-light);
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-grid .day-name {
            font-weight: 700;
            color: var(--bronze-light);
            font-size: 0.85rem;
            padding-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .calendar-grid .day {
            padding: 0.6rem 0;
            border-radius: 8px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.2s ease;
        }

        .calendar-grid .day:hover:not(.empty) {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-grid .empty {
            color: transparent;
        }

        .calendar-grid .active {
            background-color: var(--burgundy);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.6);
            transform: scale(1.05);
        }

        @media (min-width: 850px) {
            .container {
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 3.5rem;
                padding: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- RELLOTGE SVG -->
        <div class="watch-wrapper">
            <svg class="watch-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradient Bisell Bronzat / Metallic -->
                    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8c7355"/>
                        <stop offset="30%" stop-color="#c5a072"/>
                        <stop offset="50%" stop-color="#69533c"/>
                        <stop offset="75%" stop-color="#d4af7a"/>
                        <stop offset="100%" stop-color="#3d2e1e"/>
                    </linearGradient>

                    <!-- Textura Esfera -->
                    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="60%" stop-color="#1c2127"/>
                        <stop offset="100%" stop-color="#0d1013"/>
                    </radialGradient>
                </defs>

                <!-- Corretja superior i inferior -->
                <g fill="#181a1c" stroke="#0d0e10" stroke-width="1">
                    <path d="M 145 0 L 255 0 L 245 80 L 155 80 Z" />
                    <path d="M 155 320 L 245 320 L 255 400 L 145 400 Z" />
                    <rect x="175" y="15" width="50" height="10" rx="5" fill="#070b19"/>
                    <rect x="175" y="35" width="50" height="10" rx="5" fill="#070b19"/>
                    <rect x="175" y="55" width="50" height="10" rx="5" fill="#070b19"/>
                    <rect x="175" y="335" width="50" height="10" rx="5" fill="#070b19"/>
                    <rect x="175" y="355" width="50" height="10" rx="5" fill="#070b19"/>
                    <rect x="175" y="375" width="50" height="10" rx="5" fill="#070b19"/>
                </g>

                <!-- Bisell Exterior Bronzat -->
                <circle cx="200" cy="200" r="160" fill="url(#bezelGrad)" stroke="#221810" stroke-width="2" />
                <circle cx="200" cy="200" r="136" fill="none" stroke="#2a2015" stroke-width="3" />

                <!-- Textos gravats al bisell -->
                <g fill="#4a3b2c" font-family="Arial, sans-serif" font-weight="900" font-size="9" letter-spacing="1">
                    <text x="68" y="172" transform="rotate(-65 68 172)">LIGHT</text>
                    <text x="60" y="205" transform="rotate(-90 60 205)">UP-MENU</text>
                    <text x="68" y="238" transform="rotate(-115 68 238)">DOWN</text>
                </g>

                <!-- Cargols del bisell -->
                <g fill="#5c4a38" stroke="#2a1f15" stroke-width="1">
                    <circle cx="82" cy="115" r="5" />
                    <circle cx="318" cy="115" r="5" />
                    <circle cx="318" cy="285" r="5" />
                    <circle cx="82" cy="285" r="5" />
                    <circle cx="200" cy="50" r="4" />
                </g>

                <!-- Esfera interior -->
                <circle cx="200" cy="200" r="132" fill="url(#dialGrad)" stroke="#111" stroke-width="4" />

                <!-- MARQUES DE MINUTS I HORES -->
                <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
                    <line x1="200" y1="74" x2="200" y2="88" />
                    <line x1="263" y1="91" x2="256" y2="103" />
                    <line x1="309" y1="137" x2="297" y2="144" />
                    <line x1="326" y1="200" x2="312" y2="200" />
                    <line x1="309" y1="263" x2="297" y2="256" />
                    <line x1="263" y1="309" x2="256" y2="297" />
                    <line x1="200" y1="326" x2="200" y2="312" />
                    <line x1="137" y1="309" x2="144" y2="297" />
                    <line x1="91" y1="263" x2="103" y2="256" />
                    <line x1="74" y1="200" x2="88" y2="200" />
                    <line x1="91" y1="137" x2="103" y2="144" />
                    <line x1="137" y1="91" x2="144" y2="103" />
                </g>

                <!-- Sub-marques fines de minuts -->
                <circle cx="200" cy="200" r="122" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="1 5.38" opacity="0.7" />

                <!-- TRIANGLE AMB DOS PUNTS A LES 12H -->
                <g fill="#ffffff">
                    <polygon points="200,80 190,98 210,98" />
                    <circle cx="183" cy="84" r="3" />
                    <circle cx="217" cy="84" r="3" />
                </g>

                <!-- BATÓ DOBLE A LES 11H -->
                <g fill="#ffffff">
                    <rect x="138" y="87" width="4" height="16" transform="rotate(-30 140 95)" />
                    <rect x="144" y="83" width="4" height="16" transform="rotate(-30 146 91)" />
                </g>

                <!-- NÚMEROS DE L'ESFERA COL·LOCATS AMB EXACTITUD -->
                <g fill="#ffffff" font-family="-apple-system, Arial, sans-serif" font-weight="bold" font-size="26" text-anchor="middle" dominant-baseline="central">
                    <text x="250" y="113">1</text>
                    <text x="287" y="150">2</text>
                    <!-- 3h reservat per a la data -->
                    <text x="287" y="250">4</text>
                    <text x="250" y="287">5</text>
                    <text x="200" y="300">6</text>
                    <text x="150" y="287">7</text>
                    <text x="113" y="250">8</text>
                    <text x="100" y="200">9</text>
                    <text x="113" y="150">10</text>
                </g>

                <!-- TEXT DIA I DATA (Ex. VEN 18) -->
                <text id="dateText" x="252" y="201" fill="#ffffff" font-family="-apple-system, Arial, sans-serif" font-weight="bold" font-size="20" text-anchor="middle" dominant-baseline="central">VEN 18</text>

                <!-- AGULLA DE LES HORES -->
                <g id="hourHand">
                    <path d="M 194 200 L 197 125 C 197 120, 203 120, 203 125 L 206 200 Z" fill="#ffffff"/>
                    <path d="M 197 195 L 199 135 L 201 135 L 203 195 Z" fill="#1c2127"/>
                </g>

                <!-- AGULLA DELS MINUTS -->
                <g id="minuteHand">
                    <path d="M 195 200 L 198 90 C 198 85, 202 85, 202 90 L 205 200 Z" fill="#ffffff"/>
                    <path d="M 198 195 L 199 100 L 201 100 L 202 195 Z" fill="#1c2127"/>
                </g>

                <!-- AGULLA DELS SEGONS (VERMELLA FINA AMB FLETXA EN PUNTA) -->
                <g id="secondHand">
                    <line x1="200" y1="225" x2="200" y2="82" stroke="#e63946" stroke-width="1.8" stroke-linecap="round"/>
                    <polygon points="200,70 194,82 206,82" fill="#e63946"/>
                    <circle cx="200" cy="220" r="4" fill="#e63946"/>
                </g>

                <!-- PIVOT CENTRAL -->
                <circle cx="200" cy="200" r="6" fill="#ffffff" />
                <circle cx="200" cy="200" r="3" fill="#111111" />
            </svg>
        </div>

        <!-- CALENDARI MENSUAL -->
        <div class="calendar-wrapper">
            <div class="calendar-header" id="monthYear"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hourHand = document.getElementById('hourHand');
            const minuteHand = document.getElementById('minuteHand');
            const secondHand = document.getElementById('secondHand');
            const dateText = document.getElementById('dateText');

            const daysOfWeek = ["DIUM", "DILL", "DIM", "DIMC", "DIJ", "VEN", "DISS"];

            function updateClock() {
                const now = new Date();
                const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
                const minutes = now.getMinutes() + seconds / 60;
                const hours = (now.getHours() % 12) + minutes / 60;

                const secondDeg = seconds * 6;
                const minuteDeg = minutes * 6;
                const hourDeg = hours * 30;

                secondHand.setAttribute('transform', `rotate(${secondDeg}, 200, 200)`);
                minuteHand.setAttribute('transform', `rotate(${minuteDeg}, 200, 200)`);
                hourHand.setAttribute('transform', `rotate(${hourDeg}, 200, 200)`);

                const dayName = daysOfWeek[now.getDay()];
                const dayNum = now.getDate();
                dateText.textContent = `${dayName} ${dayNum}`;

                requestAnimationFrame(updateClock);
            }

            requestAnimationFrame(updateClock);

            // CALENDARI MENSUAL
            const monthYearEl = document.getElementById('monthYear');
            const gridEl = document.getElementById('calendarGrid');
            
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const currentDate = today.getDate();

            const monthNames = [
                "Gener", "Febrer", "Març", "Abril", "Maig", "Juny",
                "Juliol", "Agost", "Setembre", "Octubre", "Novembre", "Desembre"
            ];
            const dayNames = ["Dl", "Dt", "Dc", "Dj", "Dv", "Ds", "Dg"];

            monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            dayNames.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.classList.add('day-name');
                dayHeader.textContent = day;
                gridEl.appendChild(dayHeader);
            });

            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            let offset = firstDay === 0 ? 6 : firstDay - 1;
            let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < offset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day', 'empty');
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day');
                dayCell.textContent = day;

                if (day === currentDate) {
                    dayCell.classList.add('active');
                }

                gridEl.appendChild(dayCell);
            }
        });
    </script>
</body>
</html>
