<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rellotge de Pèndol 3D — Catalunya · Donec Perficiam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100dvh;
    width: 100vw;
    background: radial-gradient(ellipse at 50% 35%, #16203a 0%, #080e20 55%, #02030a 100%);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: Georgia, serif;
  }

  .scene {
    width: min(90vw, 78vh);
    aspect-ratio: 1024 / 1536;
    perspective: 2000px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  /* Contenidor que gira */
  .flip-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
    transform: rotateY(0deg);
  }

  /* Contenidor de les capes de volum */
  .vol-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
  }

  /* Cada capa daurada del volum */
  .vol-layer {
    position: absolute;
    inset: 0;
    clip-path: url(#shieldClip);
    background: radial-gradient(ellipse at 42% 38%,
      #fff4c4 0%,
      #f0c65c 20%,
      #d4af37 45%,
      #b8860b 68%,
      #6b4c05 88%,
      #3a2705 100%);
  }

  /* Cares (anvers i revers) */
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    clip-path: url(#shieldClip);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    pointer-events: none;
  }

  /* Anvers: rellotge */
  .face-front {
    transform: translateZ(18px);
  }

  /* Revers: escut (girat 180°) */
  .face-back {
    transform: rotateY(180deg) translateZ(18px);
  }

  /* Contenidor del rellotge que gira les busques */
  .clock-overlay {
    position: absolute;
    /* Centrat sobre l'esfera del rellotge — ajustat per a la imatge donada */
    top: 25.5%;
    left: 50%;
    transform: translateX(-50%);
    width: 56%;
    aspect-ratio: 1 / 1;
    pointer-events: none;
    z-index: 10;
  }
  .clock-overlay svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .agulla {
    transform-origin: 100px 100px;
    transition: transform 0.2s cubic-bezier(0.4, 2.4, 0.6, 1);
  }
  .agulla-segons {
    transition: transform 0.15s cubic-bezier(0.4, 2.4, 0.6, 1);
  }

  /* Indicador per saber si està girant */
  .flip-3d.girant {
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .flip-3d { transition: none; }
  }
</style>
</head>
<body>

<!-- Clip-path amb la silueta de l'escut (cinta + cos punxegut + ornament superior) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="shieldClip" clipPathUnits="objectBoundingBox">
      <path d="
        M 0.42,0.00
        L 0.58,0.00
        L 0.58,0.03
        L 0.62,0.04
        L 0.62,0.07
        L 0.58,0.09
        L 0.58,0.12
        L 0.85,0.13
        L 0.90,0.17
        L 0.92,0.22
        L 0.92,0.55
        C 0.92,0.78 0.78,0.92 0.50,0.98
        C 0.22,0.92 0.08,0.78 0.08,0.55
        L 0.08,0.22
        L 0.10,0.17
        L 0.15,0.13
        L 0.42,0.12
        L 0.42,0.09
        L 0.38,0.07
        L 0.38,0.04
        L 0.42,0.03
        Z" />
    </clipPath>
  </defs>
</svg>

<div class="scene" id="scene">
  <div class="flip-3d" id="flip3d">
    <!-- Capes de volum (generades per JS) -->
    <div class="vol-container" id="volContainer"></div>

    <!-- Anvers: rellotge -->
    <div class="face face-front">
      <img src="rellotge.png" alt="Rellotge de pèndol Catalunya">
      <!-- Superposició SVG amb les busques funcionals -->
      <div class="clock-overlay">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Agulla de les hores -->
          <g class="agulla agulla-hores" id="agullaHores">
            <line x1="100" y1="100" x2="100" y2="55"
                  stroke="#1a0f05" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="100" cy="55" r="2.5" fill="#1a0f05"/>
          </g>
          <!-- Agulla dels minuts -->
          <g class="agulla agulla-minuts" id="agullaMinuts">
            <line x1="100" y1="100" x2="100" y2="35"
                  stroke="#1a0f05" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="100" cy="35" r="2" fill="#1a0f05"/>
          </g>
          <!-- Centre daurat -->
          <circle cx="100" cy="100" r="4.5" fill="#8a6d1f"/>
          <circle cx="100" cy="100" r="2.5" fill="#f0c65c"/>
          <circle cx="99" cy="99" r="1" fill="#fff4c4" opacity="0.8"/>
        </svg>
      </div>
    </div>

    <!-- Revers: escut -->
    <div class="face face-back">
      <img src="escut.png" alt="Escut heràldic Donec Perficiam">
    </div>
  </div>
</div>

<script>
(function () {
  // ==================== GENERACIÓ DEL VOLUM 3D ====================
  (function generaVolum() {
    const contenidor = document.getElementById('volContainer');
    if (!contenidor) return;

    const totalCapes = 25;
    const gruixTotal = 36;

    for (let i = 0; i < totalCapes; i++) {
      const capa = document.createElement('div');
      capa.className = 'vol-layer';
      const zPos = -gruixTotal / 2 + (i * (gruixTotal / (totalCapes - 1)));
      capa.style.transform = `translateZ(${zPos.toFixed(2)}px)`;
      const foscor = Math.abs(zPos) / (gruixTotal / 2);
      capa.style.opacity = (1 - foscor * 0.18).toFixed(2);
      contenidor.appendChild(capa);
    }
  })();

  // ==================== GIR DE 180° EN CLICAR ====================
  const flip3d = document.getElementById('flip3d');
  const scene = document.getElementById('scene');

  let rotacioActual = 0;
  let girEnCurs = false;

  function gira() {
    if (girEnCurs) return;
    girEnCurs = true;
    flip3d.classList.add('girant');

    // Sempre sumem 180° (mateix sentit de gir acumulatiu)
    rotacioActual += 180;
    flip3d.style.transform = `rotateY(${rotacioActual}deg)`;

    // Tanquem el bloqueig quan acabi la transició (5s)
    setTimeout(() => {
      girEnCurs = false;
      flip3d.classList.remove('girant');
    }, 5000);
  }

  scene.addEventListener('click', gira);
  scene.addEventListener('touchstart', (e) => {
    e.preventDefault();
    gira();
  }, { passive: false });

  // ==================== RELLOTGE EN TEMPS REAL ====================
  const agullaHores = document.getElementById('agullaHores');
  const agullaMinuts = document.getElementById('agullaMinuts');

  function actualitzaRellotge() {
    const ara = new Date();
    const h = ara.getHours() % 12;
    const m = ara.getMinutes();
    const s = ara.getSeconds();

    // Angle de les hores (amb desplaçament pels minuts)
    const angHores = (h * 30) + (m * 0.5);
    // Angle dels minuts (amb desplaçament pels segons)
    const angMinuts = (m * 6) + (s * 0.1);

    agullaHores.setAttribute('transform', `rotate(${angHores}, 100, 100)`);
    agullaMinuts.setAttribute('transform', `rotate(${angMinuts}, 100, 100)`);
  }

  actualitzaRellotge();
  setInterval(actualitzaRellotge, 1000);

  // ==================== TIC-TAC DEL PÈNDOL ====================
  // Web Audio API: crea un "tic" i un "tac" alternats cada segon
  let audioCtx = null;
  let audioIniciat = false;

  function obtenirAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Crea un so curt metàl·lic (com l'escapament d'un rellotge de pèndol)
  function reprodueixTic(esTic) {
    const ctx = obtenirAudioCtx();
    if (!ctx) return;

    const ara = ctx.currentTime;

    // El "tic" és lleugerament més agut que el "tac"
    const freqBase = esTic ? 2400 : 2000;

    // Component principal: oscil·lador curt
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freqBase, ara);
    osc.frequency.exponentialRampToValueAtTime(freqBase * 0.6, ara + 0.03);

    gain.gain.setValueAtTime(0.0001, ara);
    gain.gain.linearRampToValueAtTime(0.08, ara + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0008, ara + 0.05);

    // Filtre per donar-li caràcter metàl·lic i "clic"
    const filtre = ctx.createBiquadFilter();
    filtre.type = 'bandpass';
    filtre.frequency.value = freqBase;
    filtre.Q.value = 8;

    osc.connect(filtre);
    filtre.connect(gain);
    gain.connect(ctx.destination);

    osc.start(ara);
    osc.stop(ara + 0.06);

    // Component de soroll curt per al "clac" mecànic
    const bufferSize = Math.floor(ctx.sampleRate * 0.015);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    }
    const soroll = ctx.createBufferSource();
    soroll.buffer = buffer;

    const gainSoroll = ctx.createGain();
    gainSoroll.gain.setValueAtTime(0.05, ara);
    gainSoroll.gain.exponentialRampToValueAtTime(0.0001, ara + 0.02);

    const filtreSoroll = ctx.createBiquadFilter();
    filtreSoroll.type = 'highpass';
    filtreSoroll.frequency.value = 3000;

    soroll.connect(filtreSoroll);
    filtreSoroll.connect(gainSoroll);
    gainSoroll.connect(ctx.destination);

    soroll.start(ara);
    soroll.stop(ara + 0.02);
  }

  // Comença el tic-tac quan l'usuari interactua per primera vegada (política d'autoplay)
  function iniciaTicTac() {
    if (audioIniciat) return;
    const ctx = obtenirAudioCtx();
    if (!ctx) return;
    audioIniciat = true;

    let esTic = true;
    // Sincronitzem amb el següent segon exacte
    const ara = Date.now();
    const msFinsSeguent = 1000 - (ara % 1000);

    setTimeout(() => {
      reprodueixTic(esTic);
      esTic = !esTic;
      setInterval(() => {
        reprodueixTic(esTic);
        esTic = !esTic;
      }, 1000);
    }, msFinsSeguent);
  }

  // Activem l'àudio al primer clic o toc
  ['click', 'touchstart', 'keydown'].forEach(ev => {
    document.addEventListener(ev, iniciaTicTac, { once: true, passive: true });
  });

})();
</script>

</body>
</html>
